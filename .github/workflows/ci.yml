name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    # apps/api's Vitest suite (Story 8.2, NFR9) runs real integration tests
    # against Postgres/Redis, same as local dev's docker-compose services —
    # POSTGRES_DB is the test DB directly here (CI's instance is ephemeral
    # per run, no separate create-database step needed like local dev's
    # `db:test:create`). Ports match docker-compose.yml/vitest.config.ts's
    # defaults so no DATABASE_URL/REDIS_URL overrides are needed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todoapp
          POSTGRES_PASSWORD: todoapp
          POSTGRES_DB: todoapp_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U todoapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test
