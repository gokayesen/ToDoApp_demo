      - { id: "8.1", title: "CI pipeline: lint, typecheck, unit+integration tests gating PRs (pulled forward from Epic 8 per sequencing note)", size: S, status: done, maps_to: "NFR9", notes: "Delivered 2026-07-21. Pulled forward to Sprint 1 in planning but never actually implemented until now — this row sat at status: ready (not done) for the entire time Sprint 13's own note incorrectly claimed it was already delivered; caught and confirmed with the user at the start of this session via git log + working-tree inspection (no test framework installed anywhere, .github/workflows/ci.yml was still exactly Story 1.1's lint+typecheck skeleton, nothing more). Added Vitest to apps/api and apps/web, Supertest to apps/api. Wrote one real unit test (services/position.service.test.ts, all 4 branches of computePosition — Architecture §4's fractional-index engine) and one real Supertest integration test (routes/health.test.ts, GET /health through the actual createApp() Express instance, no DB touched) for apps/api; one real unit test (lib/due-date-status.test.ts, all 3 states of getDueStatus) for apps/web — proportionate to this S-sized story, not a full coverage pass (that's Story 8.2, L-sized, still backlog, and the natural place to add DB-backed integration tests + CI Postgres/Redis service containers). Wired 'test' scripts in both apps' package.json, a turbo.json 'test' task, root 'pnpm test', and a second parallel 'test' job in .github/workflows/ci.yml (same push/PR-to-main trigger as the existing lint-typecheck job) so it gates PRs going forward. Verified end-to-end: pnpm test/lint/typecheck all pass clean across the monorepo." }
      - { id: "8.6", title: "Observability: Sentry wired in both apps, pino structured logging in API (pulled forward from Epic 8 per sequencing note)", size: S, status: done, maps_to: "NFR10", notes: "Delivered 2026-07-21, same stale-tracker gap as 8.1 above (also never actually implemented until now). Backend: new lib/logger.ts (pino, structured JSON output, LOG_LEVEL-configurable, err serializer) wired as pino-http request-logging middleware in app.ts; replaced all 14 pre-existing console.log/console.error call sites (index.ts, middleware/error-handler.ts, sockets/broadcast.ts, jobs/run-due-date-sweep.ts, lib/email.ts, services/attachment.service.ts, services/board.service.ts) with the shared logger. New src/instrument.ts (@sentry/node) follows the same guarded-configuration pattern as lib/email.ts/lib/passport.ts/lib/r2.ts — Sentry.init() only runs if SENTRY_DSN is set; imported first (right after 'dotenv/config') in both index.ts and the standalone run-due-date-sweep.ts entrypoint so ESM's depth-first module evaluation order puts it ahead of the rest of the app. Sentry.setupExpressErrorHandler(app) wired into app.ts between the route mounts and the existing errorHandler (which still runs unchanged afterward — Sentry's handler re-throws via next(err)), also DSN-guarded. Frontend: @sentry/nextjs manual setup (no wizard, no live Sentry project available in this environment) — src/instrumentation-client.ts, src/sentry.server.config.ts, src/sentry.edge.config.ts (all guarded on NEXT_PUBLIC_SENTRY_DSN), src/instrumentation.ts (register() + onRequestError = Sentry.captureRequestError), next.config.ts wrapped with withSentryConfig only when SENTRY_ORG and SENTRY_PROJECT are both set (source-map upload also needs SENTRY_AUTH_TOKEN in CI; without them the plain nextConfig is exported so an unconfigured Sentry project can never affect a build) — same guarded-optional-service convention as the API side. One real bug caught during verification, not just typecheck: Turbopack's production build warned that @sentry/node-core's OpenTelemetry auto-instrumentation deps (import-in-the-middle, require-in-the-middle) couldn't be resolved from apps/web's own directory under pnpm's strict linking ('can't be external'); fixed by adding both as direct apps/web dependencies so pnpm hoists them where Turbopack's externalization step looks — confirmed the warnings are gone on rebuild. Verified end-to-end: pnpm lint/typecheck/test clean; apps/api's tsc build boots via `node dist/index.js` and GET /health returns 200 with a real structured JSON log line observed on stdout; apps/web's `next build --turbopack` completes with zero warnings and `next start` serves / with a 200. NOT tested against a live Sentry project — no SENTRY_DSN/org/project available in this environment, same category of gap as Story 1.5's untested live Google OAuth and Story 4.8's untested live R2 bucket; every guarded code path was instead verified to correctly no-op (skip Sentry.init/setupExpressErrorHandler/withSentryConfig) with the env vars unset, the only state this environment can actually exercise." }

  - sprint: 2
    epic: "Epic 1 — Foundation & Auth (part 2)"
    theme: "Auth complete: email/password, Google OAuth, session persistence, password reset, profile, auth UI"
    depends_on_sprints: [1]
    stories:
      - { id: "1.4", title: "Email/password registration & login: argon2 hashing, /auth/register, /auth/login, /auth/refresh with rotation+reuse detection, Redis-backed rate limiting, cross-origin cookie", size: M, status: done, maps_to: "FR1, FR3, NFR3", notes: "Delivered 2026-07-18. End-to-end verified against local Postgres+Redis: register (201), duplicate email (409), login wrong/right password (401/200), refresh rotation issues a new token and invalidates the old one, replaying the old rotated token correctly revokes the whole RefreshToken family (both old and the legitimately-rotated new token then 401) — confirmed the reuse-detection security property actually works, not just labeled. Redis-backed rate limiting confirmed via response headers and Redis key inspection. Fixed two pre-existing scaffolding gaps found while wiring this in: apps/api's tsconfig NodeNext moduleResolution didn't type-check cleanly against ioredis, switched to Bundler (matches base config) since apps/api already used explicit .js extensions everywhere for Node ESM anyway; packages/shared/src/index.ts was missing a .js extension on its internal re-export. Logout endpoint and the 'authenticate' middleware for protecting other routes are intentionally out of scope here — owned by Story 1.6. KNOWN GAP (pre-existing from Story 1.1, not introduced here): packages/shared has no build step (package.json points 'main' straight at ./src/index.ts) — works fine under tsx in dev, but a production `tsc && node dist/index.js` run in apps/api would fail to resolve @todoapp/shared since plain Node can't load .ts source. Needs a real build step on packages/shared before Story 8.7 (production deployment)." }
      - { id: "1.5", title: "Google OAuth login: Passport Google strategy, account-linking gated on email_verified", size: M, status: done, maps_to: "FR2", notes: "Delivered 2026-07-18. NOT live-tested against real Google OAuth (no client ID/secret available in this environment) — that requires the user to create an OAuth client in Google Cloud Console and provide GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET; the actual OAuth handshake itself is well-trodden passport-google-oauth20 library code, lower risk than our own logic. Instead directly unit-verified the higher-risk custom logic (loginOrRegisterWithGoogle) against the real local DB across all 4 branches: new user, repeat login via same linked account (no duplicate), linking to an existing password-account by verified email, and the security case — an existing account with a colliding UNVERIFIED email must not be taken over. Found and fixed two real bugs during this: (1) the app crashed entirely at boot if GOOGLE_CLIENT_ID/SECRET were unset — GoogleStrategy's constructor throws on empty clientID; fixed by only registering the strategy when configured, with /auth/google[/callback] returning a clean 503 otherwise, so the rest of the API isn't held hostage by an unconfigured optional provider. (2) the unverified-email-collision case wasn't rejected cleanly — it fell through to `createUser` and crashed with an unhandled Prisma unique-constraint exception (500) instead of a deliberate 409; fixed by checking for an existing user by email unconditionally and only proceeding with account creation if none exists. TODO before this can be marked fully demo-ready: create a real Google Cloud OAuth client (Google Cloud Console -> APIs & Services -> Credentials -> OAuth client ID, type Web application, authorized redirect URI http://localhost:4000/auth/google/callback for local dev) and set GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET, then do one real end-to-end browser login." }
      - { id: "1.6", title: "Session persistence & refresh: silent token refresh, logout (revokes token family), authenticate middleware", size: S, status: done, maps_to: "FR5", notes: "Delivered 2026-07-18. Silent token refresh + rotation already existed from Story 1.4; this story added POST /auth/logout (revokes the whole RefreshToken family via the presented cookie, idempotent on missing/already-revoked tokens, clears the cookie) and the `authenticate` middleware (Bearer access-token verification, attaches req.userId, 401 on missing/garbage/expired). Verified authenticate directly against 4 cases (valid/missing/garbage/expired token) since no protected route exists yet to hit over HTTP — Story 1.8 (/users/me) is the first real consumer. Verified logout end-to-end over HTTP: revokes session, a post-logout refresh attempt correctly fails (surfaces as the same 'reuse detected' 401 path as token theft, since logout revocation and reuse-detection revocation are the same underlying mechanism — behavior is correct, just note the error message is a little imprecise for this specific case, not worth a special-cased message). Logout confirmed idempotent for both an already-revoked cookie and no cookie at all." }
      - { id: "1.7", title: "Forgot/reset password: signed time-boxed token, Resend email delivery, reset form", size: M, status: done, maps_to: "FR3", notes: "Delivered 2026-07-18. Scope interpreted as backend-only (POST /auth/forgot-password, POST /auth/reset-password) — the actual 'reset form' UI is Story 1.9's job (Auth screens UI), not duplicated here. Resend integration follows the same guarded pattern as Google OAuth (Story 1.5): with no RESEND_API_KEY configured, logs the reset link to console instead of failing, so the flow is fully testable without a live email provider — confirmed NOT yet tested against a real Resend send. Added one security behavior beyond the literal story text: resetting a password revokes ALL of that user's active refresh-token sessions (not just one), since a reset is a signal the old credentials may be compromised — end-to-end verified with two concurrent login sessions, both killed by one reset. Also verified: no account-enumeration (forgot-password returns 204 identically whether or not the email exists), single-use token enforcement (reusing a spent token correctly 400s and does not silently re-apply), and garbage-token rejection. Hit and worked around an unrelated environment issue during testing: an earlier `tsx watch` background process survived its TaskStop and kept squatting on port 4000 as a zombie; killed it directly via PID and confirmed no repeat." }
      - { id: "1.8", title: "User profile: display name + avatar (upload or generated initials), GET/PATCH /users/me", size: S, status: done, maps_to: "FR4", notes: "Delivered 2026-07-18. First real consumer of Story 1.6's authenticate middleware — verified end-to-end over HTTP (not just direct function calls like 1.6 had to do): valid token, missing token, garbage token, name update, avatarUrl update, invalid-URL rejection (400). Scope interpretation: PATCH /users/me accepts an avatarUrl string directly rather than building a file-upload endpoint — the R2 presigned-upload infrastructure this would need doesn't exist until Epic 4 Story 4.8, and building it twice (once generically here, once for card attachments there) would be duplicate work outside this story's S sizing. 'Generated initials' fallback needs no backend support at all — it's a pure frontend rendering concern (render initials from `name` when avatarUrl is null), left for Story 1.9." }
      - { id: "1.9", title: "Auth screens UI (sign in/up/forgot password) per UX §4.5, shadcn/ui form components", size: M, status: done, maps_to: "UX §4.5", notes: "Delivered 2026-07-18, completing Epic 1. Built: shadcn/ui init (button/input/label/card/separator — the 'form' registry component didn't install cleanly so these are plain useState-controlled forms instead of react-hook-form, proportionate for 2-3 field forms and consistent with 'server is the source of truth' since backend Zod validation is authoritative anyway); an in-memory-access-token API client + AuthContext with silent-refresh-on-load per Architecture §7.2; TanStack Query provider per Architecture §2 (not yet consumed by real queries — first real usage lands with Epic 2 data fetching); /login, /register, /forgot-password, /reset-password, /auth/callback (Google OAuth redirect landing page) per UX §4.5's minimal centered-card layout; a placeholder home page just enough to close the loop (real Dashboard is Story 2.10). No claude-in-chrome tools were actually available in this environment despite being listed, so verification used a throwaway Playwright script instead (chromium, deleted after the run) driving the real dev servers — 10/10 checks passed: register->home, logout->login, wrong-password error, correct login, SESSION SURVIVES A HARD RELOAD via the httpOnly refresh cookie (the actual architectural property Architecture §7.2/C1 cared about — meaningfully stronger than the curl-based cookie-jar tests used for earlier backend stories), forgot-password confirmation, duplicate-email rejection, and the Google button pointing at the correct backend URL. NOT tested in-browser: the reset-password page with a real token (backend logic already verified in Story 1.7; only the page's own token-read-from-URL wiring is unverified) and the OAuth callback page against a real Google login (still blocked on live Google credentials per Story 1.5)." }

