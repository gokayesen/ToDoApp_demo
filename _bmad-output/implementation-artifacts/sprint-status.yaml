  - sprint: 7
    epic: "Epic 5 — Real-Time Collaboration (part 1, pulled forward)"
    theme: "Socket gateway, presence, broadcast pipeline — de-risk WS infra early per Architecture §10"
    depends_on_sprints: [6]
    notes: "Pulled forward per Epics-and-Stories.md Cross-Epic Sequencing Note: starts right after Epic 3, not after Epic 4."
    stories:
      - { id: "5.1", title: "Socket.io gateway: handshake auth via access token, connection middleware, board:join/leave with role re-validation, Redis adapter, client reconnect-on-refresh", size: L, status: done, maps_to: "Architecture §6", notes: "Delivered 2026-07-20. Backend: apps/api/src/sockets/gateway.ts -- io.use() handshake middleware verifies the JWT access token with the same verifyAccessToken() the REST authenticate middleware uses, rejecting before board:join is possible; board:join/board:leave handlers join/leave room board:{boardId}, re-validating the caller's effective role server-side per request rather than trusting the client-supplied id. Extracted the Owner-implicit-ADMIN-else-BoardMember-row role resolution out of middleware/load-resource-context.ts into services/board-role.service.ts so both REST and the socket gateway share one implementation instead of two copies drifting apart. Redis adapter wired via @socket.io/redis-adapter with two duplicated ioredis connections (pub/sub needs dedicated connections, can't share lib/redis.ts's client since a subscriber connection can't issue other commands). index.ts now builds an explicit http.Server via http.createServer(app) so Socket.io can share the same port as the REST API. apps/api's tsx watch dev process restarted clean with the change, confirmed via /health. Frontend: lib/socket-client.ts (one shared socket per browser session, auth as a callback function so every reconnect attempt reads the current in-memory token, connect_error triggers a silent REST refreshSession()+retry per Architecture §6's 'reconnection on token expiry') and hooks/use-board-room.ts (join on mount/connect, leave on unmount), wired into the Board View page -- nothing user-visible yet since there's no presence UI (Story 5.2) or broadcast consumption (Story 5.3) to show, this only establishes the room membership those stories build on. Explicitly did NOT touch Railway/production deployment in this story -- that's out of scope until Story 8.7; this is local-dev-server infra only, same Postgres+Redis docker-compose services already in use. End-to-end verified via a raw socket.io-client script: missing/garbage token both rejected at handshake, valid token accepted, Owner's implicit ADMIN can join their own board, nonexistent board rejected, a user with zero board access rejected, and that same user succeeds after being invited as VIEWER (role re-validation is live, not cached) -- 9/9 checks. Also verified via Playwright that the real Board View page establishes a socket.io connection with no unexpected console errors." }
      - { id: "5.2", title: "Presence: Redis presence set per board room, presence:update broadcast, live avatar stack", size: M, status: done, maps_to: "FR32, UX §6", notes: "Delivered 2026-07-20 (commit f9072e0). Note added 2026-07-20 during retroactive sprint-status reconciliation — see the commit for original implementation detail." }
      - { id: "5.3", title: "Broadcast pipeline: every List/Card mutation emits its event to the board room after DB commit", size: L, status: done, maps_to: "FR31, Architecture §6 event catalog", notes: "Delivered 2026-07-20 (commit 8000c10). Note added 2026-07-20 during retroactive sprint-status reconciliation — see the commit for original implementation detail." }

  - sprint: 8
    epic: "Epic 4 — Card Detail & Rich Content (part 1)"
    theme: "Card Detail shell, title/description, labels, dates, assignees"
    depends_on_sprints: [6]
    stories:
      - { id: "4.1", title: "Card Detail modal/drawer shell (responsive: modal desktop, sheet mobile)", size: M, status: done, maps_to: "UX §4.3", notes: "Delivered 2026-07-20 (commit d104c14). New apps/web/src/components/board/card-detail.tsx: a single base-ui Dialog.Popup with responsive Tailwind classes (fixed inset-0 full-screen by default, sm: breakpoint switches to a centered max-w-2xl rounded modal) rather than two separate components — same single-DialogContent approach as ui/dialog.tsx. Shows title + Board/List breadcrumb + close button only; metadata row, description, checklists, attachments, and the activity/comment feed are explicitly out of scope here (later Epic 4 stories). Opens on CardItem click or Enter keypress (Space stays reserved for dnd-kit's drag pick-up); the 'Move to list' dropdown's click is now stopPropagation'd so it no longer also opens the card underneath it. Card data is read straight from board-lists.tsx's existing cardsByList state (already the live, broadcast-synced source of truth per Story 5.4) — no new GET /cards/:cardId endpoint needed for the shell. Verified with a throwaway Playwright script (chromium, deleted after the run): registered a user, created workspace/board/list/card via the real API, then drove the real UI — desktop modal shows correct title+breadcrumb, closes via both the close button and Escape, and at a 390x844 mobile viewport the popup's bounding box is exactly 0,0,390,844 confirming a true full-screen sheet, not just a resized modal." }
      - { id: "4.2", title: "Inline-editable title & markdown description", size: S, status: done, maps_to: "FR18", notes: "Delivered 2026-07-20 (commit 9e01833). Backend: PATCH /cards/:cardId, title/description both independently optional in updateCardRequestSchema so a save of one field doesn't clobber the other; requireRole('MEMBER') same as every other Card mutation. Frontend: title is click/Enter-to-edit (input, saves on blur or Enter, Escape reverts); description renders via react-markdown + a newly-added @tailwindcss/typography plugin (`prose` classes) when not focused, plain textarea while editing. On save, patches the ['cards', listId] TanStack Query cache directly with the PATCH response instead of invalidating, to avoid a flash back to the pre-edit value during the refetch round-trip. Two real bugs caught and fixed during Playwright verification, not just typecheck/lint: (1) base-ui's Dialog closes the whole modal on Escape by default — the field-level Escape handler needed event.stopPropagation() or it bubbled up and closed Card Detail entirely instead of just cancelling the field edit; (2) React unmounting a still-focused input/textarea (on cancel) makes the browser fire a native blur, which was re-triggering the save handler with the just-cancelled draft — fixed with a cancelledRef flag reset at the start of each new edit session (an earlier version of the fix forgot to reset it on re-entering edit mode, which then silently swallowed the NEXT legitimate save — caught by scripting two edit cycles in one verification run, not just one). Verified with a throwaway Playwright script (deleted after the run): rename persists after reload, Escape truly cancels without saving, markdown (heading/bold/list) renders correctly after a real save+reload round trip." }
      - { id: "4.3", title: "Labels: per-board CRUD (name+color) + attach/remove on card, accessible color palette", size: M, status: done, maps_to: "FR24", notes: "Delivered 2026-07-20 (commit 397e66d). New Label + CardLabel (join) Prisma models, both cascading from their parent. Label taxonomy is board-scoped, ADMIN-gated (same rationale as Board background customization, Story 2.9); attach/detach on a Card is MEMBER-gated like every other Card mutation. Every Card-returning query in card.repository.ts now includes+flattens Labels so Card.labels is always populated consistently regardless of endpoint. Frontend: a LabelPicker popover built on the existing DropdownMenu primitive (CheckboxItem-style toggle rows) handles create/rename/delete/attach/detach in one place; Card Detail shows attached labels as named chips, the board face (card-item.tsx) shows color-only dots per UX §4.2. 8-swatch palette is the dataviz skill's validated categorical palette, with blue stepped one shade darker (#256abf vs #2a78d6) since label chips render text directly on the fill and the reference shade falls just short of 4.5:1 AA against white. TWO real bugs found via Playwright, not just typecheck/lint: (1) typing in the picker's create-label Input was being intercepted by DropdownMenu's own roving-focus/typeahead keydown handling — fixed with a stopPropagation wrapper. (2) A genuine Next.js 15.5.20/Turbopack barrel-file bug (not a logic bug): importing ANY value export (const array or Record object; type-only imports are unaffected) from packages/shared's schemas/label.ts into a 'use client' component broke the bundler's resolution of unrelated sibling exports from the whole shared-package barrel (packages/shared/src/index.ts) — reproduced by bisecting with git stash + incremental file stubs across ~10 dev-server restarts. Worked around by moving the presentation-only LABEL_COLORS/LABEL_COLOR_HEX/LABEL_COLOR_TEXT constants into apps/web/src/lib/label-colors.ts; packages/shared keeps only the LabelColor type + validation enum. Flagging this pattern for future Epic 4 stories (4.5 Assignees, 4.6 Checklists, etc.) in case any of them also need a shared-package const value consumed by a client component — see [[project-nextjs-shared-barrel-bug]]. Verified end-to-end with a throwaway Playwright script (deleted after the run): create/rename/delete a Label, attach/detach on a Card, persistence after reload, empty-state message, and a picker-dropdown screenshot confirming correct swatch/contrast rendering." }
      - { id: "4.4", title: "Due/start dates + overdue visual flag (color+icon, not color-only)", size: S, status: done, maps_to: "FR25", notes: "Delivered 2026-07-20. Backend: updateCardRequestSchema (packages/shared) gained nullable/optional startDate+dueDate with a refine() rejecting startDate-after-dueDate (400); card.repository.ts updateCardFields widened to accept them (already flowed through card.service.ts's existing pass-through updateCard, no service/controller/route change needed since PATCH /cards/:cardId was already wired to this schema from Story 4.2). Frontend: new apps/web/src/lib/due-date-status.ts centralizes the tri-state overdue/due-soon(<=24h)/on-track classification shared by card-item.tsx's face pill and card-detail.tsx's status text, so the 'due soon' window is defined once. Card face pill now color+icon codes by status (red+AlertTriangle / amber+Clock / muted+Calendar) rather than the old flat clock-icon-only pill, each with an sr-only text label per UX §8 'color is never the only signal'. Card Detail gained a Dates row (native date inputs for Start/Due, immediate-save on change, same UX §4.3 metadata-row position between Labels and Description) plus an inline Overdue/Due soon/On track status label. Verified end-to-end with a throwaway Playwright+fetch script (deleted after the run): dueDate persistence, startDate-after-dueDate 400 rejection, null-clears-a-date, overdue/due-soon pill color classes on the board face, due-date input pre-fill from a server-set value, a UI-driven startDate edit round-tripping to the backend, and the on-track status text rendering in Card Detail — 8/8 checks." }
      - { id: "4.5", title: "Assignees: add/remove Board Members on a card", size: S, status: done, maps_to: "FR26", notes: "Delivered 2026-07-20. New CardAssignee join model (migration 20260720131849_card_assignees), plain many-to-many cascading from both sides per Architecture §4's cascade table (same 'pure membership row' rationale as BoardMember/WorkspaceMember). POST/DELETE /cards/:cardId/assignees, requireRole('MEMBER') like every other Card mutation; assignment validated against an explicit BoardMember row via card.service.ts assignUser -- rejects with 400 if the target userId has no BoardMember row on this board. Scope decision: a Workspace Owner's implicit Board access (Architecture §7.4, no BoardMember row) is therefore NOT assignable through this endpoint/picker -- same explicit-membership scope Story 2.5/2.6's invite/role-change already operate on; documented on packages/shared's new boardMemberSchema and the listBoardMembers repository function rather than silently left ambiguous. Had to add GET /boards/:boardId/members (didn't exist at all -- Epic 2's invite/role-change stories built the mutation endpoints but no listing endpoint or UI ever consumed board membership), VIEWER-gated same as GET /boards/:boardId itself. card.repository.ts's include/mapCard (previously 'withLabels', Story 4.3) generalized to 'withRelations' covering both Labels and Assignees in one place. Frontend: new AssigneePicker (apps/web/src/components/board/assignee-picker.tsx) mirrors LabelPicker's toggle-row popover pattern minus the create/edit form (Board Member management stays Board settings' job, out of scope here); extracted PersonAvatar + a generic AvatarStack (apps/web/src/components/ui/person-avatar.tsx) out of presence-avatars.tsx -- real reuse once Card assignees needed the identical 'avatar or initials, +N overflow' rendering UX §4.2 specifies (max 3 shown on the card face) as presence already had. Verified end-to-end with a throwaway Playwright+fetch script (deleted after the run): invite-adds-existing-user, GET /boards/:id/members lists them, assign/unassign round-trip on a Card, assigning a non-member 400s, unassign idempotency, and the assignee avatar rendering both inside Card Detail and on the board-face card after using the real picker UI -- 8/8 checks." }

  - sprint: 9
    epic: "Epic 4 — Card Detail & Rich Content (part 2)"
    theme: "Checklists, comments, attachments, activity log"
    depends_on_sprints: [8]
    stories:
      - { id: "4.6", title: "Checklists: create, add/check/reorder items, progress bar", size: M, status: done, maps_to: "FR27", notes: "Delivered 2026-07-20. New Checklist + ChecklistItem models (migration 20260720133404_checklists), Card -> Checklist -> ChecklistItem, cascading per Architecture §4; position uses the same shared fractional-index engine as List/Card (services/position.service.ts) -- Checklists themselves only append (no reorder-checklist endpoint, story scope is 'reorder items' not checklists). Route surface: nested POST /cards/:cardId/checklists for creation (same nested-under-parent convention as List/Card), plus new top-level /checklists and /checklist-items routers (delete checklist, create/update/delete/move item) -- needed two new loadResourceContext walkers (Checklist->Card->List->Board, ChecklistItem->Checklist->Card->List->Board) alongside the existing Board/List/Card/Label ones. Every mutation reloads+broadcasts the whole parent Card via the existing card:updated event rather than the Architecture §6 catalog's separate 'checklist:updated' name -- same choice Story 4.3/4.5 made (the client's live-update hook already merges full card:updated payloads, including nested checklists, for free). Real bug caught during Playwright verification, not just typecheck: the checkbox was purely server-round-trip-controlled with no optimistic update, so Playwright's own click-then-verify assertion failed -- UX §5 explicitly names 'check a checklist item' as an optimistic-update example, so toggling now writes straight into the ['cards', listId] TanStack cache (with a snapshot rollback on error) so the checkbox AND its progress bar move together instantly instead of after the PATCH resolves. Item reordering is keyboard-operable up/down buttons, not drag-and-drop -- UX §5's DnD pattern is explicitly scoped to Lists/Cards (FR15/FR19) only, so a third independent dnd-kit sortable context here would be scope beyond FR27. Card face gained a '3/5' checklist-progress pill per UX §4.2 (turns accent-colored on 100% completion). Verified end-to-end with a throwaway Playwright+fetch script (deleted after the run): checklist/item CRUD, check-toggle, rename, reorder (including a self-referential-move 400 rejection), delete, checklist delete, and the real UI flow (add checklist, add 2 items, check one, progress text and board-face pill both showing 1/2) -- 11/11 checks." }
      - { id: "4.7", title: "Comments with @mention autocomplete (scoped to Board Members)", size: M, status: done, maps_to: "FR28", notes: "Delivered 2026-07-20. New Comment model (migration 20260720135336_comments): userId nullable + SetNull on user deletion, authorNameSnapshot denormalized at creation, per Architecture §4's cascade table (same rationale as the not-yet-built Attachment.uploaderId/ActivityLog.userId). POST /cards/:cardId/comments nested (same convention as Checklist creation, Story 4.6); DELETE /comments/:commentId is a new top-level router with an extra author-or-admin check in comment.service.ts -- the one Card-content mutation in the app that ISN'T uniformly MEMBER-gated regardless of who created the thing, since a comment is a personal statement (every other mutation -- labels, assignees, dates, checklists -- any Member can touch any Card's content). Scope decision: @mentions are a plain-text '@Full Name' convention, no structured mention table (the Architecture §4 ER diagram's Comment entity has no mention field either) -- the composer's autocomplete (reuses Story 4.5's GET /boards/:boardId/members + AssigneePicker's board-members query cache) inserts literal text on selection, the feed re-highlights matches against the board's CURRENT member names (longest-name-first regex to avoid a short name shadowing inside a longer one). No Notification wiring -- Notification/NotificationPreference don't exist until Epic 6 Story 6.1, and firing a mention notification is explicitly Story 6.3's job, not this one. Client-side delete-button visibility only checks 'is this my own comment' (no board-role awareness exists anywhere on the client yet) -- the backend's admin-override still works for anyone calling the API directly, just has no UI affordance yet; flagging this gap in case a future story wants a real moderation UI. Card face gained a comment-count icon per UX §4.2, in the same 'small icon row' as the Story 4.6 checklist-progress pill. Verified end-to-end with a throwaway Playwright+fetch script (deleted after the run): comment create/delete, author-vs-non-author-vs-admin delete authorization (3 cases), and the real UI flow -- typing '@Mem' surfaces the autocomplete, selecting it inserts '@Member Tester ', the posted comment renders the mention highlighted, and the board-face pill shows the correct comment count -- 8/8 checks." }
      - { id: "4.8", title: "Attachments: presigned R2 upload, image thumbnail vs. file-link rendering, size-limit enforcement", size: M, status: done, maps_to: "FR29", notes: "Delivered 2026-07-20. New Attachment model (migration 20260720141553_attachments): uploaderId nullable + SetNull, uploaderNameSnapshot denormalized, same pattern as Story 4.7's Comment.userId. createdAt added even though the Architecture §4 ER diagram's Attachment block omits it (unlike Comment/ActivityLog, which both have one) -- chronological ordering needs it, same kind of gap-fill as Story 3.9's archivedWithList. Direct-to-R2 two-step flow per Architecture §3/§9 (API never proxies file bytes): POST /cards/:cardId/attachments/presign (new apps/api/src/lib/r2.ts, @aws-sdk/client-s3 + s3-request-presigner) issues a short-lived PUT URL, client uploads straight to R2, then POST /cards/:cardId/attachments records the result; when R2 is configured, fileUrl must live under our own R2_PUBLIC_URL base before being recorded (prevents an authenticated Member registering an arbitrary external URL as a Card attachment). Size limit proceeded with the documented-but-UNCONFIRMED 10MB default (PRD §9 assumption #3, still open per open_items_before_first_standup) per user's explicit go-ahead this session -- validated at both the presign and confirm steps. Deletion (DELETE /attachments/:attachmentId) uses the same uploader-or-admin authorization as Story 4.7's comment deletion, not the uniform any-Member gate every other Card-content mutation uses. r2.ts follows the exact guarded-configuration pattern as lib/email.ts (Resend, Story 1.7) and passport.ts (Google OAuth, Story 1.5): no R2 credentials configured -> presign 503s cleanly rather than the process assuming storage exists. NOT tested against a real R2 bucket in this environment (no live credentials, same gap as Story 1.5's untested live Google OAuth handshake) -- verified instead via the confirm-record endpoint directly (bypassing presign, since the fileUrl-prefix check only applies when R2 IS configured) for uploader snapshot, size-limit rejection, and the three-case uploader/non-uploader/admin delete-authorization matrix, plus confirming the clean 503 surfaces all the way to a UI error message when a real upload is attempted. Card face gained an attachment-count icon (UX §4.2's last icon-row slot, after checklist progress and comment count); Card Detail's Attachments section (between Checklists and Comments, matching UX §4.3's literal ordering) renders an image thumbnail grid vs. file-icon rows per FR29. 10/10 Playwright+fetch checks passed." }
      - { id: "4.9", title: "Card Activity Log: system-generated entries interleaved with comments", size: M, status: done, maps_to: "FR30", notes: "Delivered 2026-07-20, completing Epic 4 (4.1-4.9 all done). New ActivityLog model (migration 20260720143319_activity_log) matching Architecture §4's ER diagram exactly: boardId required, cardId nullable -- this story only ever writes card-scoped entries (scope decision: board/workspace-level activity, e.g. membership changes, has no writer yet since no story asks for a board-level activity UI). cardId uses SetNull (not Cascade) on Card deletion, extending the same 'preserves the audit trail' rationale Architecture §4 states for the userId SetNull relations -- deleting a Card shouldn't erase the board's history of what happened to it. Single logActivity() helper (services/activity-log.service.ts) called from every existing Card-content mutation's mutate->reload->broadcast round-trip (card/checklist/attachment services) -- had to thread actorId through several service signatures that didn't carry it before (updateCard, archiveCard/restoreCard, attachLabel/detachLabel, assignUser/unassignUser, createChecklist/deleteChecklist), since none of those needed 'who did this' before now. Logged events: title rename, description edit, due/start date change (set and clear both logged distinctly), cross-list move only (a same-list reorder is NOT logged -- not a status change, matches UX §4.3's own example which is specifically a cross-list move), label attach/detach, assignee add/remove, checklist create/delete, attachment add/remove, archive/restore (only on an actual state flip, not idempotent re-affirmation). Comments are deliberately NOT double-logged as activity -- the feed already renders them directly. Frontend: comment-section.tsx merges card.comments + card.activityLog into one chronologically-sorted feed per UX §4.3's literal wording; new apps/web/src/lib/describe-activity.ts maps {type, metadata} to the human-readable line ('Ayşe moved this card from To Do to Doing', matching the UX spec's own example almost verbatim). Card Detail's section header renamed Comments -> Activity to match the merged content. Verified end-to-end with a throwaway Playwright+fetch script (deleted after the run): all 12 event types logged with correct metadata across the full mutation surface, within-list-reorder correctly NOT logged, idempotent archive correctly NOT double-logged, comments correctly NOT logged, chronological ordering, and the real UI rendering both the human-readable activity line and an interleaved comment in the same feed -- 22/22 checks." }

  - sprint: 10
    epic: "Epic 5 — Real-Time Collaboration (part 2)"
    theme: "Client-side live updates + UX polish, now that Epic 4 event types exist"
    depends_on_sprints: [7, 9]
    notes: "RECONCILIATION NOTE (2026-07-20): 5.4 and 5.7 were actually delivered on 2026-07-20 ahead of this sprint's own dependency, depends_on_sprints: [7, 9] — Sprint 9 (Epic 4) had NOT been started yet at that point (no Card Detail, no Label/Comment/Checklist/Attachment models existed). This was safe for 5.4 and 5.7 (board-level broadcasts/toasts, no Card Detail dependency) but left 5.5 and 5.6 stranded — both explicitly require an open Card Detail (UX §6), which didn't exist. Caught at the start of this 2026-07-20 session (this tracker wasn't being read/updated at all — reconciliation is post-hoc from git log); user chose to backfill Epic 4 (starting Sprint 8) before returning to 5.5/5.6 rather than force them through early or skip them permanently."
    stories:
      - { id: "5.4", title: "Client-side live-update handling: merge socket events into TanStack Query cache, animate card move + highlight fade", size: M, status: done, maps_to: "FR31, UX §6", notes: "Delivered 2026-07-20 (commit 660cc81), ahead of this sprint's planned dependency on Sprint 9/Epic 4 — see the sprint-level reconciliation note above. See the commit for original implementation detail." }
      - { id: "5.5", title: "Also viewing this card indicator + live field updates inside an open Card Detail", size: M, status: done, maps_to: "UX §6", notes: "Delivered 2026-07-20, now that Epic 4 (Sprint 8/9) has landed Card Detail for this to attach to. Backend: card-level presence mirrors board presence (Story 5.2) one room deeper — new gateway.ts card:join/card:leave handlers re-resolve Card->List->Board->role server-side per join (same 'never trust a client-supplied id' rule as board:join), new presence.service.ts markCardPresent/markCardAbsent/listCardPresence against a `presence:card:{cardId}` Redis set, broadcasting card:presence:update to a narrower `card:{cardId}` room (not the whole board room) so only people with that specific Card Detail open receive it. Deliberately did NOT reuse markAbsent's unconditional delete of the shared per-socket heartbeat key for markCardAbsent -- that key is shared with whichever board room the same socket is still in, and closing a Card Detail must not evict the user from the board's own presence list; markCardAbsent only srems the card set. Frontend: new useCardRoom/useCardPresence hooks (apps/web/src/hooks) mirror useBoardRoom/usePresence one level deeper; card-detail.tsx renders 'X is also viewing this card' (UX §6's own wording) via a small AvatarStack+text row, using the existing AvatarStack/PersonAvatar primitives from Story 4.5. 'Live field updates' were largely already working structurally (card:updated already merges into the ['cards', listId] TanStack cache that board-lists.tsx derives the open Card from, Story 5.4) -- what was missing was the visual highlight treatment UX §6 asks for ('update it live with the same brief highlight treatment'). Added a small useValueHighlight hook local to card-detail.tsx that diffs each metadata row's own previous vs. current value (title, description, dates, labels, assignees) and flashes the same boxShadow ring card-item.tsx uses on the board face for HIGHLIGHT_MS (exported from use-board-live-updates.ts for reuse) on any change -- including this client's own save, same accepted quirk the board-face highlight already has, since card:updated carries no actorId to tell the two apart. Checklists/attachments/comments are NOT covered by this per-field highlight (their own child components already have independent optimistic-update treatments from Stories 4.6-4.9) -- scoped to the fields rendered directly in Card Detail's own metadata section, proportionate to this story's M sizing. Verified end-to-end with a throwaway Playwright+fetch script (deleted after the run): two real browser contexts (owner + an invited Member) opening the same Card -- no indicator while alone, correct 'is also viewing' text once both have it open, indicator disappears when one closes it; a live title edit from one context appeared in the other's still-open Card Detail with the highlight ring's boxShadow demonstrably changing (not a static transparent value) as it flashed and faded -- 6/6 checks." }
      - { id: "5.6", title: "Concurrent-edit conflict signal (version/updatedAt comparison, inline just-updated-by-X notice)", size: M, status: done, maps_to: "FR33, UX §6", notes: "Delivered 2026-07-20/21, completing Sprint 10 (5.4-5.7 all done). Architecture gap found and confirmed with the user before starting: Card had no createdAt/updatedAt at all (Architecture §4's ER diagram never modeled one, unlike Comment/ActivityLog) -- user chose the straightforward option (a single Prisma @updatedAt column, PATCH carries expectedUpdatedAt, mismatch -> 409) over per-field versioning. Migration 20260720222036_card_updated_at backfills existing rows via a column DEFAULT CURRENT_TIMESTAMP (prisma migrate dev can't add a required column to a non-empty table without one) -- Prisma's own @updatedAt then manages the value at the application layer on every write going forward, same as any other @updatedAt column. Backend: card.service.ts updateCard checks input.expectedUpdatedAt against the just-loaded card.updatedAt (from loadCardContext) BEFORE writing -- a mismatch throws HttpError(409, 'This card was just updated by <name> -- your view has been refreshed.'), where <name> comes from a fresh findCardById() lookup's activityLog.at(-1).actorNameSnapshot (Story 4.9's existing per-action author snapshot, reused rather than adding new plumbing just to name who won). expectedUpdatedAt is destructured out of the request body before it reaches updateCardFields (repository) -- Prisma's own runtime arg validation would reject it as an unknown Card column otherwise. Scope decision: only PATCH /cards/:cardId (title/description/dates) runs this check -- label/assignee/checklist mutations are join-table writes that don't touch the Card row's own updatedAt, and archive/move legitimately DO bump it (bumping it on any Card-row write, not just title/description, is an accepted consequence of the single-timestamp design the user picked). Frontend: card-detail.tsx captures expectedUpdatedAtRef.current = card.updatedAt once at startEditingTitle/Description (NOT read fresh inside saveTitle/saveDescription, which are redefined every render and would otherwise silently pick up a just-arrived live update's newer timestamp, defeating the whole check) and sends it on save; date inputs send the current card.updatedAt directly since they have no multi-keystroke edit session to capture at the start of. mutation.onError checks for ApiError.status===409 and shows the server's own message as an inline amber notice under the title for 6s, dropping back to read mode -- the winning value was already visible (live card:updated merge from Story 5.4/5.5 reaches the loser's cache before their own save round-trip resolves), so this is purely an explanation, not a refetch. Verified end-to-end with a throwaway Playwright+fetch script (deleted after the run): backend curl-equivalent checks (correct expectedUpdatedAt saves and advances updatedAt, stale expectedUpdatedAt 409s with the right actor name in the message AND does not apply the rejected write, omitting expectedUpdatedAt entirely still works for backward-compat) plus a real two-browser-context race (owner and an invited Member both open the same Card, both enter title edit mode, owner saves first cleanly with no notice, Member's now-stale save surfaces 'This card was just updated by Owner Tester...' and Member's Card Detail shows the Owner's winning title, not their own lost edit) -- 10/10 checks." }
      - { id: "5.7", title: "Background-change toast for board sections currently out of view", size: S, status: done, maps_to: "UX §6", notes: "Delivered 2026-07-20 (commit a468450), ahead of this sprint's planned dependency on Sprint 9/Epic 4 — see the sprint-level reconciliation note above. No Card Detail dependency (board-level toast only), so this one was safe to deliver early. See the commit for original implementation detail." }

  - sprint: 11
    epic: "Epic 6 — Notifications"
    theme: "In-app notification center + transactional email + preferences"
    depends_on_sprints: [9]
    stories:
      - { id: "6.1", title: "Notification and NotificationPreference data models + GET/PATCH endpoints", size: M, status: done, maps_to: "FR34, FR35, FR36", notes: "Delivered 2026-07-21. New Notification (migration 20260720223504_notifications) + NotificationPreference models per Architecture §4's ER diagram, both Cascade on User delete -- 'purely personal, never shared with other users', same rationale Architecture §4 gives for RefreshToken/PasswordResetToken (Notification isn't explicitly named in the cascade table but the ER diagram's User-receives-Notification relation plus that rationale make Cascade the only sensible read). Scope decision: Notification.type and NotificationPreference.eventType are both plain strings, NOT a Zod enum like ActivityLog.type -- no story writes a Notification row yet (concrete triggers are Story 6.3's job), so enumerating values with zero producers would be speculative; deferred to whichever story first needs concrete values. NotificationPreference has no row until a user actually changes a default -- GET/PATCH /notifications/preferences treats a missing (userId, eventType) row as 'defaults enabled' (both flags true), PATCH upserts a single named eventType and preserves the untouched flag on a partial update (verified: patching only inAppEnabled after an earlier emailEnabled-only patch left emailEnabled's prior value intact rather than resetting it to the schema default). Routes: purely user-scoped, authenticate-only (no board/role context needed) -- GET /notifications, PATCH /notifications/:id/read, PATCH /notifications/read-all, GET/PATCH /notifications/preferences, same shape as Story 1.8's /users/me. Mark-as-read enforces ownership by 404ing (not 403ing) on a notification that exists but belongs to a different user, same not-found-not-forbidden information-hiding choice used elsewhere in the app. Verified end-to-end via curl against the real dev server (no throwaway Playwright needed -- no UI exists yet, Story 6.2 builds the Notification Center that will consume this): empty-list on a fresh user, preference upsert-create then partial-upsert-update preserving the other flag, unauthenticated 401, two notification rows seeded directly via Prisma (nothing writes them yet) then listed newest-first, mark-one-read, mark-nonexistent-read 404s, a second user attempting to mark the first user's notification read also 404s (ownership enforced), and read-all correctly flips the remaining unread row -- 11/11 checks. Test users/rows cleaned up from the local DB after verification." }
      - { id: "6.2", title: "Notification Center UI: slide-over panel, grouped by day, unread state, click-through navigation", size: M, status: done, maps_to: "FR36, UX §4.4", notes: "Delivered 2026-07-21. Frontend-only consumer of Story 6.1's endpoints. Two contract decisions made here since no producer writes a Notification row yet (Story 6.3's job, so there was nothing real to consume as precedent): the panel reads `payload.message` as the human-readable line (falling back to a generic 'New notification') and `payload.boardId` as the click-through target -- Story 6.3 must populate these keys for its real triggers. Click-through only navigates to the Board, not directly into a Card -- board-lists.tsx has no open-card-by-id mechanism (query param or otherwise) for a deep link to attach to, and building one now would be scope beyond an S-sized UI story. Panel is a right-side slide-over (base-ui Dialog Root/Portal/Backdrop/Popup used directly, same primitives card-detail.tsx's full-screen-sheet override composes, not the ui/dialog.tsx wrapper, since a right-edge slide needs its own positioning classes) triggered from the top-bar bell, which was previously an inert 'coming soon' stub (Story 2.11) -- swapped for the real NotificationCenter component. 'Notification settings' footer link deliberately stays an inert disabled stub with the same title='...coming soon' convention, since its real destination (Story 6.6's per-event preference screen) doesn't exist yet. Grouped by day via a small groupNotificationsByDay helper (Today/Yesterday/formatted date), relying on GET /notifications' own newest-first ordering rather than re-sorting. Real bug caught during Playwright verification, not just typecheck: mark-as-read used invalidateQueries, but handleSelect calls mutate() then immediately router.push()es away on a boardId click -- the panel (and its useMutation) unmounts before the PATCH round-trip resolves, so the invalidate's refetch either never lands or loses a race against a fresh mount's own refetch-on-mount on the destination page, leaving the bell's unread dot stale after navigating. Fixed with a real optimistic update (onMutate + onSuccess reconciliation + onError rollback, same pattern Story 4.6's checklist-item toggle established) plus staleTime: Infinity on the query itself, since nothing outside this component's own mutations changes server state yet (no live-push producer) -- refetch-on-mount was otherwise an unnecessary race, not a freshness need. Verified end-to-end with a throwaway Playwright+Prisma script (deleted after the run): seeded notifications directly via Prisma (today unread w/ boardId, today read, yesterday unread), real UI login, both day groups + all three messages rendering correctly, clicking a boardId-less notification marks it read server-side without navigating, clicking a boardId notification marks it read AND navigates to /boards/:id closing the panel, the bell's unread dot correctly present before and gone after, and Mark-all-as-read clearing a freshly-seeded unread row -- 12/12 checks. One rate-limit false-start during verification (Story 1.4's Redis-backed /auth/register limiter, tripped by repeated script re-runs against the same local IP, not an app bug) -- cleared the local dev Redis key and re-ran clean." }
      - { id: "6.3", title: "Notification triggers: assignment, @mention, added to board/workspace", size: M, status: done, maps_to: "FR34", notes: "Delivered 2026-07-21. Due-date approaching/overdue (FR34's fourth trigger) is explicitly Story 6.4's job (a sweep job, not an inline mutation trigger), out of scope here. New notification.service.ts notifyUser(userId, type, payload) is the single call site every trigger below goes through -- it also makes real, currently-only use of NotificationPreference.inAppEnabled (Story 6.1 modeled the field but nothing read it yet): a false row suppresses creation entirely rather than writing a hidden/suppressed row, since the app has no such concept elsewhere; a missing row still means enabled, same contract 6.1 established. `type` doubles as the NotificationPreference `eventType` key across both tables. Four concrete type values populate the payload.message/payload.boardId contract Story 6.2 already reads: card.assigned (card.service.ts assignUser, skips self-assignment), comment.mention (comment.service.ts createComment, parses @Full Name against listBoardMembers with the same longest-name-first regex the client's own re-highlighting logic uses, skips self-mention), workspace.added and board.added (workspace.service.ts/board.service.ts's existing-user-direct-add invite branches, AND auth.service.ts resolvePendingInvites' new-user-registers-into-a-pending-invite branch -- both are 'added to a board/workspace', just reached via the two different paths Epic 2 built; workspace.added omits boardId since there's no dedicated workspace page to click through to). Known, pre-existing gap surfaced (not introduced) by @mention: the Workspace Owner has no explicit BoardMember row (Architecture §7.4's implicit-access model), so they don't appear in listBoardMembers and can't be @mentioned -- identical scope boundary Story 4.5's assignee picker already documented for the same underlying reason, and the same list the client's own mention-autocomplete (Story 4.7) draws from, so this doesn't regress anything actually reachable through the UI today. Verified end-to-end via a throwaway Playwright-free curl+Prisma script (no UI involved -- Story 6.2 already verified the consumption side): all 4 triggers firing with correct message/boardId payloads across both the direct-add and invite-resolves-on-registration paths for workspace/board add, card assignment notifying the assignee, comment mention notifying the mentioned member, self-assignment and self-mention correctly NOT notifying the actor, and an inAppEnabled:false preference correctly suppressing a subsequent card.assigned notification -- 17/17 checks." }
      - { id: "6.4", title: "Due-date reminder job: approaching/overdue sweep, single-instance cron or Redis leader-lock", size: M, status: done, maps_to: "FR34, NFR5", notes: "Delivered 2026-07-21. jobs/due-date-sweep.ts's runDueDateSweep() is pure job logic (Architecture §5's 'jobs/ holds job logic only' convention), wrapped by two things per Architecture §9: a new jobs/leader-lock.ts Redis SETNX helper (withLeaderLock, PX+NX with a release-on-finish), and jobs/run-due-date-sweep.ts, the standalone CLI entrypoint ('node dist/jobs/run-due-date-sweep.js', wired to package.json's new sweep:due-dates script) that Story 8.7 will point a real Railway cron trigger at once this API is deployed. Since 8.7 hasn't run yet, index.ts also wires the explicitly-sanctioned interim: an in-process setInterval (every 15min, immediate first run on boot) that every api instance runs, each attempting the same Redis lock so only one instance's tick actually executes per interval -- 'never fire unconditionally per-instance' per Architecture §9's literal wording. Idempotency required a real schema gap-fill (same pattern as archivedWithList/updatedAt before it): Card gained dueSoonNotifiedAt/overdueNotifiedAt nullable timestamps (migration 20260720230236_card_due_date_notified_at) so a re-run of the sweep doesn't re-notify a card whose due-date state hasn't changed; card.service.ts updateCard resets both to null whenever dueDate is actually changed (dateChanged, already computed there for Story 4.9's activity log), so a rescheduled due date can trigger fresh notifications rather than staying permanently silenced. Overdue takes priority over due-soon per card (once a due date has passed, a retroactive 'due soon' notice for an already-closed window doesn't make sense) using a straightforward if/else-if, not two independent checks. Notifies every one of a Card's Assignees individually (FR34 says 'a due date they're assigned to', plural-capable), through the same notifyUser() from Story 6.3 -- so NotificationPreference gating (card.due_soon/card.overdue eventTypes) applies here for free. The 24h due-soon window constant is duplicated server-side rather than imported from apps/web/src/lib/due-date-status.ts or hoisted into packages/shared, specifically to avoid re-triggering the known Next.js/Turbopack barrel bug from Story 4.3 ([[project-nextjs-shared-barrel-bug]]) where a 'use client' component importing a shared-package value export broke unrelated sibling exports. packages/shared's cardSchema gained the two new fields for type-completeness (mapCard spreads the full Prisma row, so they're already on the wire; not consumed by any UI). Verified end-to-end with a throwaway tsx+Prisma script (deleted after the run) exercising runDueDateSweep() and withLeaderLock() directly against the real DB/Redis, not just the CLI wrapper: a due-soon card notifying both of its two assignees individually, an overdue card notifying its assignee, a far-future card correctly NOT notified, a second sweep run correctly not re-notifying either (idempotency), rescheduling a due date resetting dueSoonNotifiedAt and triggering a fresh notification on the next sweep, and the leader lock itself -- two concurrent acquisition attempts on the same key running the callback exactly once, and the lock being re-acquirable immediately after release -- 17/17 checks." }
      - { id: "6.5", title: "Transactional email via Resend + React Email templates per notification type", size: M, status: done, maps_to: "FR35", notes: "Delivered 2026-07-21. Introduces React/JSX into apps/api for the first time (a plain Express service, no framework doing this for free) -- added react/react-dom (pinned to apps/web's 19.1.0 for consistency), the unified react-email v6 package (bundles both components and render(), superseding the older separate @react-email/components + @react-email/render split per its own migration guide, confirmed via Context7), @types/react, and \"jsx\": \"react-jsx\" in apps/api/tsconfig.json -- verified the plain `tsc` production build (package.json's existing build script) compiles the new .tsx file correctly, not just tsx-watch dev mode. One shared apps/api/src/emails/notification-email.tsx layout component (Html/Tailwind/Body/Container/Heading/Text/Button) covers all 6 event types rather than 6 near-identical files, since the only thing that differs per type is subject/heading/CTA-label copy -- delivers 'templates per notification type' as distinct content mapped through one render path, not 6 duplicated JSX trees; notification.service.ts's new buildEmailContent(type) switch supplies that copy, reusing payload.message as-is as the email body (already a complete sentence at every Story 6.3/6.4 call site) and payload.boardId to build an optional CTA link (workspace.added has none, matching Story 6.2's NotificationCenter having the same boardId-less case). Real bug caught and fixed while wiring this in, not just typecheck: notifyUser (Story 6.3) treated its single NotificationPreference row as one on/off switch (inAppEnabled:false skipped row creation AND, if left wired naively, would have also skipped email) -- but inAppEnabled/emailEnabled are independent flags in the Story 6.1 schema, so notifyUser now checks each separately, letting a user want the email without the in-app row or vice versa. Also caught and fixed a genuine duplicate-send bug this story's own new gated path would have caused: workspace.service.ts/board.service.ts's existing-user-direct-add branches were already unconditionally calling sendWorkspaceMemberAddedEmail/sendBoardMemberAddedEmail (predating the Notification model, Story 2.3/2.5) — since notifyUser now also emails for workspace.added/board.added, leaving both in place would have double-sent to anyone who hadn't disabled email preferences; removed the old unconditional calls and their now-dead functions from lib/email.ts, keeping sendWorkspaceInviteEmail/sendBoardInviteEmail as-is since those target an email with no User row yet (nothing to gate against). Verified end-to-end with a throwaway tsx+Prisma script (deleted after the run, RESEND_API_KEY intentionally left unconfigured so real sends go through the existing dev-log fallback instead of hitting a live provider): render() directly producing a real HTML document containing the message text, CTA link+label when boardId is present, and correctly omitting any href when it isn't; inAppEnabled:false suppressing the in-app row while emailEnabled:true still logs the email (and vice versa, independently); and the workspace-add flow logging exactly one email now, not two -- 13/13 checks." }
      - { id: "6.6", title: "Per-event email preference settings screen", size: S, status: backlog, maps_to: "FR35" }

