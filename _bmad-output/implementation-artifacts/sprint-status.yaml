      - { id: "5.7", title: "Background-change toast for board sections currently out of view", size: S, status: done, maps_to: "UX §6", notes: "Delivered 2026-07-20 (commit a468450), ahead of this sprint's planned dependency on Sprint 9/Epic 4 — see the sprint-level reconciliation note above. No Card Detail dependency (board-level toast only), so this one was safe to deliver early. See the commit for original implementation detail." }

