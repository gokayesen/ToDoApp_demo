    stories:
      - { id: "5.4", title: "Client-side live-update handling: merge socket events into TanStack Query cache, animate card move + highlight fade", size: M, status: done, maps_to: "FR31, UX §6", notes: "Delivered 2026-07-20 (commit 660cc81), ahead of this sprint's planned dependency on Sprint 9/Epic 4 — see the sprint-level reconciliation note above. See the commit for original implementation detail." }
      - { id: "5.5", title: "Also viewing this card indicator + live field updates inside an open Card Detail", size: M, status: done, maps_to: "UX §6", notes: "Delivered 2026-07-20, now that Epic 4 (Sprint 8/9) has landed Card Detail for this to attach to. Backend: card-level presence mirrors board presence (Story 5.2) one room deeper — new gateway.ts card:join/card:leave handlers re-resolve Card->List->Board->role server-side per join (same 'never trust a client-supplied id' rule as board:join), new presence.service.ts markCardPresent/markCardAbsent/listCardPresence against a `presence:card:{cardId}` Redis set, broadcasting card:presence:update to a narrower `card:{cardId}` room (not the whole board room) so only people with that specific Card Detail open receive it. Deliberately did NOT reuse markAbsent's unconditional delete of the shared per-socket heartbeat key for markCardAbsent -- that key is shared with whichever board room the same socket is still in, and closing a Card Detail must not evict the user from the board's own presence list; markCardAbsent only srems the card set. Frontend: new useCardRoom/useCardPresence hooks (apps/web/src/hooks) mirror useBoardRoom/usePresence one level deeper; card-detail.tsx renders 'X is also viewing this card' (UX §6's own wording) via a small AvatarStack+text row, using the existing AvatarStack/PersonAvatar primitives from Story 4.5. 'Live field updates' were largely already working structurally (card:updated already merges into the ['cards', listId] TanStack cache that board-lists.tsx derives the open Card from, Story 5.4) -- what was missing was the visual highlight treatment UX §6 asks for ('update it live with the same brief highlight treatment'). Added a small useValueHighlight hook local to card-detail.tsx that diffs each metadata row's own previous vs. current value (title, description, dates, labels, assignees) and flashes the same boxShadow ring card-item.tsx uses on the board face for HIGHLIGHT_MS (exported from use-board-live-updates.ts for reuse) on any change -- including this client's own save, same accepted quirk the board-face highlight already has, since card:updated carries no actorId to tell the two apart. Checklists/attachments/comments are NOT covered by this per-field highlight (their own child components already have independent optimistic-update treatments from Stories 4.6-4.9) -- scoped to the fields rendered directly in Card Detail's own metadata section, proportionate to this story's M sizing. Verified end-to-end with a throwaway Playwright+fetch script (deleted after the run): two real browser contexts (owner + an invited Member) opening the same Card -- no indicator while alone, correct 'is also viewing' text once both have it open, indicator disappears when one closes it; a live title edit from one context appeared in the other's still-open Card Detail with the highlight ring's boxShadow demonstrably changing (not a static transparent value) as it flashed and faded -- 6/6 checks." }
      - { id: "5.6", title: "Concurrent-edit conflict signal (version/updatedAt comparison, inline just-updated-by-X notice)", size: M, status: done, maps_to: "FR33, UX §6", notes: "Delivered 2026-07-20/21, completing Sprint 10 (5.4-5.7 all done). Architecture gap found and confirmed with the user before starting: Card had no createdAt/updatedAt at all (Architecture §4's ER diagram never modeled one, unlike Comment/ActivityLog) -- user chose the straightforward option (a single Prisma @updatedAt column, PATCH carries expectedUpdatedAt, mismatch -> 409) over per-field versioning. Migration 20260720222036_card_updated_at backfills existing rows via a column DEFAULT CURRENT_TIMESTAMP (prisma migrate dev can't add a required column to a non-empty table without one) -- Prisma's own @updatedAt then manages the value at the application layer on every write going forward, same as any other @updatedAt column. Backend: card.service.ts updateCard checks input.expectedUpdatedAt against the just-loaded card.updatedAt (from loadCardContext) BEFORE writing -- a mismatch throws HttpError(409, 'This card was just updated by <name> -- your view has been refreshed.'), where <name> comes from a fresh findCardById() lookup's activityLog.at(-1).actorNameSnapshot (Story 4.9's existing per-action author snapshot, reused rather than adding new plumbing just to name who won). expectedUpdatedAt is destructured out of the request body before it reaches updateCardFields (repository) -- Prisma's own runtime arg validation would reject it as an unknown Card column otherwise. Scope decision: only PATCH /cards/:cardId (title/description/dates) runs this check -- label/assignee/checklist mutations are join-table writes that don't touch the Card row's own updatedAt, and archive/move legitimately DO bump it (bumping it on any Card-row write, not just title/description, is an accepted consequence of the single-timestamp design the user picked). Frontend: card-detail.tsx captures expectedUpdatedAtRef.current = card.updatedAt once at startEditingTitle/Description (NOT read fresh inside saveTitle/saveDescription, which are redefined every render and would otherwise silently pick up a just-arrived live update's newer timestamp, defeating the whole check) and sends it on save; date inputs send the current card.updatedAt directly since they have no multi-keystroke edit session to capture at the start of. mutation.onError checks for ApiError.status===409 and shows the server's own message as an inline amber notice under the title for 6s, dropping back to read mode -- the winning value was already visible (live card:updated merge from Story 5.4/5.5 reaches the loser's cache before their own save round-trip resolves), so this is purely an explanation, not a refetch. Verified end-to-end with a throwaway Playwright+fetch script (deleted after the run): backend curl-equivalent checks (correct expectedUpdatedAt saves and advances updatedAt, stale expectedUpdatedAt 409s with the right actor name in the message AND does not apply the rejected write, omitting expectedUpdatedAt entirely still works for backward-compat) plus a real two-browser-context race (owner and an invited Member both open the same Card, both enter title edit mode, owner saves first cleanly with no notice, Member's now-stale save surfaces 'This card was just updated by Owner Tester...' and Member's Card Detail shows the Owner's winning title, not their own lost edit) -- 10/10 checks." }
      - { id: "5.7", title: "Background-change toast for board sections currently out of view", size: S, status: done, maps_to: "UX §6", notes: "Delivered 2026-07-20 (commit a468450), ahead of this sprint's planned dependency on Sprint 9/Epic 4 — see the sprint-level reconciliation note above. No Card Detail dependency (board-level toast only), so this one was safe to deliver early. See the commit for original implementation detail." }

  - sprint: 11
    epic: "Epic 6 — Notifications"
    theme: "In-app notification center + transactional email + preferences"
    depends_on_sprints: [9]
    stories:
      - { id: "6.1", title: "Notification and NotificationPreference data models + GET/PATCH endpoints", size: M, status: done, maps_to: "FR34, FR35, FR36", notes: "Delivered 2026-07-21. New Notification (migration 20260720223504_notifications) + NotificationPreference models per Architecture §4's ER diagram, both Cascade on User delete -- 'purely personal, never shared with other users', same rationale Architecture §4 gives for RefreshToken/PasswordResetToken (Notification isn't explicitly named in the cascade table but the ER diagram's User-receives-Notification relation plus that rationale make Cascade the only sensible read). Scope decision: Notification.type and NotificationPreference.eventType are both plain strings, NOT a Zod enum like ActivityLog.type -- no story writes a Notification row yet (concrete triggers are Story 6.3's job), so enumerating values with zero producers would be speculative; deferred to whichever story first needs concrete values. NotificationPreference has no row until a user actually changes a default -- GET/PATCH /notifications/preferences treats a missing (userId, eventType) row as 'defaults enabled' (both flags true), PATCH upserts a single named eventType and preserves the untouched flag on a partial update (verified: patching only inAppEnabled after an earlier emailEnabled-only patch left emailEnabled's prior value intact rather than resetting it to the schema default). Routes: purely user-scoped, authenticate-only (no board/role context needed) -- GET /notifications, PATCH /notifications/:id/read, PATCH /notifications/read-all, GET/PATCH /notifications/preferences, same shape as Story 1.8's /users/me. Mark-as-read enforces ownership by 404ing (not 403ing) on a notification that exists but belongs to a different user, same not-found-not-forbidden information-hiding choice used elsewhere in the app. Verified end-to-end via curl against the real dev server (no throwaway Playwright needed -- no UI exists yet, Story 6.2 builds the Notification Center that will consume this): empty-list on a fresh user, preference upsert-create then partial-upsert-update preserving the other flag, unauthenticated 401, two notification rows seeded directly via Prisma (nothing writes them yet) then listed newest-first, mark-one-read, mark-nonexistent-read 404s, a second user attempting to mark the first user's notification read also 404s (ownership enforced), and read-all correctly flips the remaining unread row -- 11/11 checks. Test users/rows cleaned up from the local DB after verification." }
      - { id: "6.2", title: "Notification Center UI: slide-over panel, grouped by day, unread state, click-through navigation", size: M, status: done, maps_to: "FR36, UX §4.4", notes: "Delivered 2026-07-21. Frontend-only consumer of Story 6.1's endpoints. Two contract decisions made here since no producer writes a Notification row yet (Story 6.3's job, so there was nothing real to consume as precedent): the panel reads `payload.message` as the human-readable line (falling back to a generic 'New notification') and `payload.boardId` as the click-through target -- Story 6.3 must populate these keys for its real triggers. Click-through only navigates to the Board, not directly into a Card -- board-lists.tsx has no open-card-by-id mechanism (query param or otherwise) for a deep link to attach to, and building one now would be scope beyond an S-sized UI story. Panel is a right-side slide-over (base-ui Dialog Root/Portal/Backdrop/Popup used directly, same primitives card-detail.tsx's full-screen-sheet override composes, not the ui/dialog.tsx wrapper, since a right-edge slide needs its own positioning classes) triggered from the top-bar bell, which was previously an inert 'coming soon' stub (Story 2.11) -- swapped for the real NotificationCenter component. 'Notification settings' footer link deliberately stays an inert disabled stub with the same title='...coming soon' convention, since its real destination (Story 6.6's per-event preference screen) doesn't exist yet. Grouped by day via a small groupNotificationsByDay helper (Today/Yesterday/formatted date), relying on GET /notifications' own newest-first ordering rather than re-sorting. Real bug caught during Playwright verification, not just typecheck: mark-as-read used invalidateQueries, but handleSelect calls mutate() then immediately router.push()es away on a boardId click -- the panel (and its useMutation) unmounts before the PATCH round-trip resolves, so the invalidate's refetch either never lands or loses a race against a fresh mount's own refetch-on-mount on the destination page, leaving the bell's unread dot stale after navigating. Fixed with a real optimistic update (onMutate + onSuccess reconciliation + onError rollback, same pattern Story 4.6's checklist-item toggle established) plus staleTime: Infinity on the query itself, since nothing outside this component's own mutations changes server state yet (no live-push producer) -- refetch-on-mount was otherwise an unnecessary race, not a freshness need. Verified end-to-end with a throwaway Playwright+Prisma script (deleted after the run): seeded notifications directly via Prisma (today unread w/ boardId, today read, yesterday unread), real UI login, both day groups + all three messages rendering correctly, clicking a boardId-less notification marks it read server-side without navigating, clicking a boardId notification marks it read AND navigates to /boards/:id closing the panel, the bell's unread dot correctly present before and gone after, and Mark-all-as-read clearing a freshly-seeded unread row -- 12/12 checks. One rate-limit false-start during verification (Story 1.4's Redis-backed /auth/register limiter, tripped by repeated script re-runs against the same local IP, not an app bug) -- cleared the local dev Redis key and re-ran clean." }
      - { id: "6.3", title: "Notification triggers: assignment, @mention, added to board/workspace", size: M, status: done, maps_to: "FR34", notes: "Delivered 2026-07-21. Due-date approaching/overdue (FR34's fourth trigger) is explicitly Story 6.4's job (a sweep job, not an inline mutation trigger), out of scope here. New notification.service.ts notifyUser(userId, type, payload) is the single call site every trigger below goes through -- it also makes real, currently-only use of NotificationPreference.inAppEnabled (Story 6.1 modeled the field but nothing read it yet): a false row suppresses creation entirely rather than writing a hidden/suppressed row, since the app has no such concept elsewhere; a missing row still means enabled, same contract 6.1 established. `type` doubles as the NotificationPreference `eventType` key across both tables. Four concrete type values populate the payload.message/payload.boardId contract Story 6.2 already reads: card.assigned (card.service.ts assignUser, skips self-assignment), comment.mention (comment.service.ts createComment, parses @Full Name against listBoardMembers with the same longest-name-first regex the client's own re-highlighting logic uses, skips self-mention), workspace.added and board.added (workspace.service.ts/board.service.ts's existing-user-direct-add invite branches, AND auth.service.ts resolvePendingInvites' new-user-registers-into-a-pending-invite branch -- both are 'added to a board/workspace', just reached via the two different paths Epic 2 built; workspace.added omits boardId since there's no dedicated workspace page to click through to). Known, pre-existing gap surfaced (not introduced) by @mention: the Workspace Owner has no explicit BoardMember row (Architecture §7.4's implicit-access model), so they don't appear in listBoardMembers and can't be @mentioned -- identical scope boundary Story 4.5's assignee picker already documented for the same underlying reason, and the same list the client's own mention-autocomplete (Story 4.7) draws from, so this doesn't regress anything actually reachable through the UI today. Verified end-to-end via a throwaway Playwright-free curl+Prisma script (no UI involved -- Story 6.2 already verified the consumption side): all 4 triggers firing with correct message/boardId payloads across both the direct-add and invite-resolves-on-registration paths for workspace/board add, card assignment notifying the assignee, comment mention notifying the mentioned member, self-assignment and self-mention correctly NOT notifying the actor, and an inAppEnabled:false preference correctly suppressing a subsequent card.assigned notification -- 17/17 checks." }
      - { id: "6.4", title: "Due-date reminder job: approaching/overdue sweep, single-instance cron or Redis leader-lock", size: M, status: done, maps_to: "FR34, NFR5", notes: "Delivered 2026-07-21. jobs/due-date-sweep.ts's runDueDateSweep() is pure job logic (Architecture §5's 'jobs/ holds job logic only' convention), wrapped by two things per Architecture §9: a new jobs/leader-lock.ts Redis SETNX helper (withLeaderLock, PX+NX with a release-on-finish), and jobs/run-due-date-sweep.ts, the standalone CLI entrypoint ('node dist/jobs/run-due-date-sweep.js', wired to package.json's new sweep:due-dates script) that Story 8.7 will point a real Railway cron trigger at once this API is deployed. Since 8.7 hasn't run yet, index.ts also wires the explicitly-sanctioned interim: an in-process setInterval (every 15min, immediate first run on boot) that every api instance runs, each attempting the same Redis lock so only one instance's tick actually executes per interval -- 'never fire unconditionally per-instance' per Architecture §9's literal wording. Idempotency required a real schema gap-fill (same pattern as archivedWithList/updatedAt before it): Card gained dueSoonNotifiedAt/overdueNotifiedAt nullable timestamps (migration 20260720230236_card_due_date_notified_at) so a re-run of the sweep doesn't re-notify a card whose due-date state hasn't changed; card.service.ts updateCard resets both to null whenever dueDate is actually changed (dateChanged, already computed there for Story 4.9's activity log), so a rescheduled due date can trigger fresh notifications rather than staying permanently silenced. Overdue takes priority over due-soon per card (once a due date has passed, a retroactive 'due soon' notice for an already-closed window doesn't make sense) using a straightforward if/else-if, not two independent checks. Notifies every one of a Card's Assignees individually (FR34 says 'a due date they're assigned to', plural-capable), through the same notifyUser() from Story 6.3 -- so NotificationPreference gating (card.due_soon/card.overdue eventTypes) applies here for free. The 24h due-soon window constant is duplicated server-side rather than imported from apps/web/src/lib/due-date-status.ts or hoisted into packages/shared, specifically to avoid re-triggering the known Next.js/Turbopack barrel bug from Story 4.3 ([[project-nextjs-shared-barrel-bug]]) where a 'use client' component importing a shared-package value export broke unrelated sibling exports. packages/shared's cardSchema gained the two new fields for type-completeness (mapCard spreads the full Prisma row, so they're already on the wire; not consumed by any UI). Verified end-to-end with a throwaway tsx+Prisma script (deleted after the run) exercising runDueDateSweep() and withLeaderLock() directly against the real DB/Redis, not just the CLI wrapper: a due-soon card notifying both of its two assignees individually, an overdue card notifying its assignee, a far-future card correctly NOT notified, a second sweep run correctly not re-notifying either (idempotency), rescheduling a due date resetting dueSoonNotifiedAt and triggering a fresh notification on the next sweep, and the leader lock itself -- two concurrent acquisition attempts on the same key running the callback exactly once, and the lock being re-acquirable immediately after release -- 17/17 checks." }
      - { id: "6.5", title: "Transactional email via Resend + React Email templates per notification type", size: M, status: done, maps_to: "FR35", notes: "Delivered 2026-07-21. Introduces React/JSX into apps/api for the first time (a plain Express service, no framework doing this for free) -- added react/react-dom (pinned to apps/web's 19.1.0 for consistency), the unified react-email v6 package (bundles both components and render(), superseding the older separate @react-email/components + @react-email/render split per its own migration guide, confirmed via Context7), @types/react, and \"jsx\": \"react-jsx\" in apps/api/tsconfig.json -- verified the plain `tsc` production build (package.json's existing build script) compiles the new .tsx file correctly, not just tsx-watch dev mode. One shared apps/api/src/emails/notification-email.tsx layout component (Html/Tailwind/Body/Container/Heading/Text/Button) covers all 6 event types rather than 6 near-identical files, since the only thing that differs per type is subject/heading/CTA-label copy -- delivers 'templates per notification type' as distinct content mapped through one render path, not 6 duplicated JSX trees; notification.service.ts's new buildEmailContent(type) switch supplies that copy, reusing payload.message as-is as the email body (already a complete sentence at every Story 6.3/6.4 call site) and payload.boardId to build an optional CTA link (workspace.added has none, matching Story 6.2's NotificationCenter having the same boardId-less case). Real bug caught and fixed while wiring this in, not just typecheck: notifyUser (Story 6.3) treated its single NotificationPreference row as one on/off switch (inAppEnabled:false skipped row creation AND, if left wired naively, would have also skipped email) -- but inAppEnabled/emailEnabled are independent flags in the Story 6.1 schema, so notifyUser now checks each separately, letting a user want the email without the in-app row or vice versa. Also caught and fixed a genuine duplicate-send bug this story's own new gated path would have caused: workspace.service.ts/board.service.ts's existing-user-direct-add branches were already unconditionally calling sendWorkspaceMemberAddedEmail/sendBoardMemberAddedEmail (predating the Notification model, Story 2.3/2.5) — since notifyUser now also emails for workspace.added/board.added, leaving both in place would have double-sent to anyone who hadn't disabled email preferences; removed the old unconditional calls and their now-dead functions from lib/email.ts, keeping sendWorkspaceInviteEmail/sendBoardInviteEmail as-is since those target an email with no User row yet (nothing to gate against). Verified end-to-end with a throwaway tsx+Prisma script (deleted after the run, RESEND_API_KEY intentionally left unconfigured so real sends go through the existing dev-log fallback instead of hitting a live provider): render() directly producing a real HTML document containing the message text, CTA link+label when boardId is present, and correctly omitting any href when it isn't; inAppEnabled:false suppressing the in-app row while emailEnabled:true still logs the email (and vice versa, independently); and the workspace-add flow logging exactly one email now, not two -- 13/13 checks." }
      - { id: "6.6", title: "Per-event email preference settings screen", size: S, status: done, maps_to: "FR35", notes: "Delivered 2026-07-21, completing Epic 6 (6.1-6.6 all done). New apps/web/src/app/settings/notifications/page.tsx, one row per known event type with a Switch bound to emailEnabled (a missing NotificationPreference row reads as enabled, same contract Story 6.1 established) -- inAppEnabled has no UI here, out of scope per FR35's literal 'per-event email preferences' wording and this story's own S sizing. Backend needed no new endpoints -- GET/PATCH /notifications/preferences already existed from Story 6.1; the only backend change was formalizing packages/shared's notificationEventTypeSchema (a real Zod enum of the 6 concrete values Story 6.3/6.4 established as producers, superseding Story 6.1's original 'no producer exists yet, stay a plain string' placeholder) since this is the first thing that needed a canonical list to enumerate, and retyping notificationSchema/notificationPreferenceSchema/updateNotificationPreferenceRequestSchema's type/eventType fields through it for consistency with the same pattern activityTypeSchema already established. New apps/web/src/components/ui/switch.tsx wraps @base-ui/react's Switch (Root+Thumb, data-checked styling) -- the first use of that primitive in the app, following the same data-slot/cn wrapper convention as every other ui/ component. Display labels/descriptions for the 6 event types live in a new apps/web/src/lib/notification-event-types.ts, deliberately NOT in packages/shared even though keyed by the same enum -- it's a value-exported const array consumed by a 'use client' page, and packages/shared value exports reaching a client component is exactly the known Next.js/Turbopack barrel bug from Story 4.3 ([[project-nextjs-shared-barrel-bug]]); only the type itself is imported from there. Story 6.2's NotificationCenter 'Notification settings' button (an inert 'coming soon' stub since it was built) now links here for real. Verified end-to-end with a throwaway Playwright+fetch script (deleted after the run): the panel's link navigates to the settings page and closes itself, all 6 switches render defaulting to checked (enabled) with no preference rows yet, toggling one off persists emailEnabled:false to the server, the toggle state survives a page reload (reading back from the server, not just local state), and toggling back on persists emailEnabled:true again -- 7/7 checks." }

  - sprint: 12
    epic: "Epic 7 — Search & Filtering"
    theme: "Cross-board search + board-level filters"
    depends_on_sprints: [9]
    stories:
      - { id: "7.1", title: "Cross-board keyword search (GET /search?q=), scoped to accessible boards", size: M, status: done, maps_to: "FR37", notes: "Delivered 2026-07-21. New top-level GET /search?q= (routes/search.ts), authenticate-only like notifications.ts -- no board/role middleware since accessibility is resolved per-Board inside search.repository.ts's own query rather than via loadBoardContext (there's no single :boardId param to hang that middleware off when the whole point is spanning every accessible Board at once). Accessible-Board rule mirrors board-role.service.ts's resolveBoardRole exactly (implicit ADMIN via the owning Workspace's OWNER, or an explicit BoardMember row) but expressed as a set-membership OR inside the Card query's nested list.board filter, since re-checking role per-candidate-Board one at a time would mean N extra queries instead of one. Matches Card title/description via Postgres ILIKE (Prisma's mode:'insensitive' on `contains`, no extension needed); archived Cards/Lists/Boards are excluded at every level. Query validated via a new searchQuerySchema (packages/shared/schemas/search.ts, trimmed/1-200 chars) parsed directly in the controller rather than a new validateQuery middleware -- this is the only query-string route in the app so a reusable middleware would be speculative (validateBody's the body-side precedent to mirror if a second one shows up). Results capped at 30, newest-updatedAt-first, flattened into searchResultSchema rows (id/title/description + listId/listName/boardId/boardName/workspaceId/workspaceName) so Story 7.2's UI can group-by-Board with zero extra lookups. No UI yet -- that's Story 7.2's job; this is the endpoint alone, same split as Story 6.1/6.2's data-model-then-UI sequencing. Verified end-to-end via curl against the real dev server (Postgres+Redis): keyword match on title, case-insensitive match, a non-matching keyword returning empty, missing/empty q both 400, unauthenticated 401, a second user with zero access to the Board correctly seeing empty results for a query that matches a real Card there, that same user gaining visibility the moment they're invited as VIEWER (role re-validated live, not cached), and archiving the matching Card correctly removing it from results -- 9/9 checks. Test users/workspace cleaned up from the local DB after verification." }
      - { id: "7.2", title: "Global search UI (top bar entry point, results grouped by board)", size: S, status: done, maps_to: "FR37", notes: "Delivered 2026-07-21, completing Sprint 12/Epic 7 alongside 7.1/7.3. Frontend-only consumer of Story 7.1's GET /search. Swapped the inert disabled 'Search — coming soon' stub (Story 2.11) in top-bar.tsx for a real apps/web/src/components/shell/global-search.tsx -- same base-ui Dialog Root/Portal/Backdrop/Popup-direct pattern NotificationCenter (Story 6.2) already established rather than the ui/dialog.tsx wrapper, since this needs its own top-pinned-input/scrollable-results layout instead of a generic content area (centered near-top modal here vs. NotificationCenter's right-edge slide-over -- different shape, same underlying primitive). New apps/web/src/hooks/use-debounced-value.ts (generic, delay-driven) debounces the raw input 300ms before it drives the TanStack Query key, so typing doesn't fire a request per keystroke; query is `enabled` only once the debounced value is non-empty. New lib/group-search-results-by-board.ts groups the already-ranked (newest-updatedAt-first, GET /search's own order) flat result list by boardId, preserving that order both across and within groups -- mirrors group-notifications-by-day.ts's shape/spirit for by-day grouping. Click-through only reaches the Board, not the specific Card -- same documented gap NotificationCenter's own click-through already has (board-lists.tsx has no open-card-by-id mechanism yet), not a new limitation introduced here. Verified end-to-end with a throwaway Playwright script (deleted after the run) against the real dev servers: dialog opens from the top-bar button, empty-state prompt shown before typing, a real card ('Zebra migration checklist') found and rendered under its correct Workspace/Board group header with its List name shown, a non-matching query renders the no-results message, and clicking a result closes the dialog and navigates to `/boards/:id` -- 8/8 checks (a 401 logged against /auth/refresh during the run is pre-existing Story 1.9 silent-refresh-on-load behavior on a cookie-less /login page load, unrelated to this story)." }
      - { id: "7.3", title: "Board-level filter popover: label/assignee/due-date range, dim/hide in place, active-filter badge", size: M, status: done, maps_to: "FR38, UX §4.2", notes: "Delivered 2026-07-21, completing Sprint 12/Epic 7 (7.1-7.3 all done). Purely client-side: every Card on the Board is already loaded (board-lists.tsx's own cardsByList), so filtering is a plain predicate over what's already in the TanStack cache, no new endpoint. New apps/web/src/lib/card-filters.ts holds the CardFilters shape (labelIds/assigneeIds Sets + dueFrom/dueTo native-date-input strings) and cardMatchesFilters, comparing dueDate as a sliced ISO-date string (same reasoning as card-detail.tsx's toDateInputValue -- avoids a local-timezone shift a Date-object comparison would introduce). New apps/web/src/components/board/filter-popover.tsx (UX §4.2's own wording: 'filter icon opening a filter popover (label/assignee/due-date)') sits in the Board header's right side next to PresenceAvatars (board page.tsx), not inside board-lists.tsx itself, per that same UX line placing it in the header. Labels/Assignees are toggle rows following LabelPicker/AssigneePicker's own plain-<button>-not-DropdownMenuItem convention (Story 4.3/4.5) so toggling one filter doesn't close the popover; Due date range is two native date inputs wrapped in the same onKeyDown stopPropagation LabelPicker's create-label Input already needed, for the same reason (Menu's roving-focus keydown handling would otherwise steal keystrokes). Chose DIM (opacity-only, card stays in the DOM/flow) over hide for non-matching cards -- UX §4.2's own line is explicit that filtering must cause 'no layout jump/reload', which display:none-style hiding would violate by shifting every other card in the list; dimmedIds threads through exactly like the existing highlightedIds set (board-lists.tsx -> list-column.tsx -> card-item.tsx), and CardItem's opacity style now branches isDragging > isDimmed > full, so an active drag still always wins. Filter state lives in page.tsx (lifted above BoardLists since the trigger itself lives in the page header, not inside BoardLists) and resets on boardId change via a useEffect -- Next.js reuses the same page component instance across sibling dynamic-route navigations rather than remounting it, so without this a filter set on one Board would silently carry over (and match nothing meaningful) on the next Board visited. Verified end-to-end with a throwaway Playwright+curl script (deleted after the run, plus its own debug scratch scripts) against the real dev servers and DB: filter button shows no badge with no filters active; selecting a Label shows a '(1)' badge, dims the non-matching card, keeps the matching one at full opacity, and leaves the non-matching card in the DOM (not removed); Clear filters resets the badge and opacity; an Assignee filter (using a real invited Board Member, not the Workspace Owner -- confirmed via a genuine 400 that the Owner's own implicit access still can't be assigned, the same pre-existing Story 4.5 scope boundary) correctly dims the unassigned card and not the assigned one; a due-date range filter dims a card outside the range, keeps one inside it, and correctly dims a card with no due date at all -- 12/12 checks." }

  - sprint: 13
    epic: "Epic 8 — Polish, Accessibility & Deployment (remaining)"
    theme: "Test coverage, E2E, accessibility, performance, deployment, account deletion, README"
    depends_on_sprints: [10, 11, 12]
    notes: "8.1 and 8.6 are now done (delivered 2026-07-21, see their Sprint 1 rows) — NOT actually delivered back in Sprint 1 despite being pulled forward there in planning and this note previously (incorrectly) claiming otherwise. That earlier claim was stale/wrong: this tracker had gone stale generally per the Sprint 10 reconciliation note above, and 8.1/8.6's own status field said 'ready' the whole time, not 'done'. Caught and fixed at the start of this session via git log + working-tree inspection before starting 8.2."
    stories:
      - { id: "8.2", title: "Unit + integration test coverage pass across services/repositories (Vitest + Supertest)", size: L, status: done, maps_to: "NFR9", notes: "Delivered 2026-07-21. Built the test-DB infrastructure Story 8.1 deliberately deferred (its own scope was proportionate to S-sizing: prove the wiring, not build out a real-DB harness): a dedicated `todoapp_test` Postgres database on the same local instance docker-compose already provides (one-time `pnpm --filter @todoapp/api run db:test:create`, same manual-precondition convention as docker-compose itself), Redis logical db 1, both wired via vitest.config.ts's `test.env` (so lib/prisma.ts's and lib/redis.ts's singletons connect to the test instances the moment any test file imports them) plus a `JWT_ACCESS_SECRET` test value. New vitest.global-setup.ts runs `prisma migrate deploy` against the test DB and flushes the test Redis db once per run, so the schema is always current and a previous run's rate-limiter state (Story 1.4's Redis-backed /auth limiter) can't bleed into the next. `fileParallelism: false`: most fixtures are scoped by unique random IDs and safe under Vitest's default parallel-file execution, but jobs/due-date-sweep.ts intentionally queries across the *entire* Card table with zero per-test scoping — running files in parallel would let one test's sweep pick up another test's in-flight fixtures, so the whole suite runs sequentially against the shared DB instead (simple and always-correct at this suite's size). New src/test-support/fixtures.ts provides createTestUser/createTestWorkspaceWithOwner/createTestBoard/etc. plus cleanup helpers — cleanupWorkspace before cleanupUser in every test's afterEach, since Workspace.ownerId is onDelete:Restrict (Architecture §4, Story 8.8's future ownership-transfer requirement) and cascades Board/List/Card/membership rows for free. Coverage added (24 new tests across 8 files, on top of Story 8.1's 6): board-role.service.test.ts (RBAC effective-role resolution — the single choke point Architecture §7.4 describes), auth.service.test.ts (register/duplicate-409, login wrong/right password, refresh rotation, and the reuse-detection security property — replaying a rotated-away token kills the whole token family), card.service.test.ts (position engine wiring through createCard/moveCard, the Story 5.6 optimistic-concurrency 409 including that the rejected write does NOT apply, self-referential-move 400, archive/restore idempotency), notification.service.test.ts (inAppEnabled/emailEnabled as genuinely independent flags per Story 6.5's real bug, ownership-enforced markAsRead), jobs/due-date-sweep.test.ts (overdue vs. due-soon branch selection, per-assignee notification, second-run idempotency), search.repository.test.ts (accessible-board scoping matches resolveBoardRole's own rule, archived-card exclusion, case-insensitivity), plus two real Supertest route-level tests (routes/auth.test.ts: register/login/refresh over real HTTP including the Secure refresh cookie rotating — had to forward Set-Cookie manually rather than via supertest's agent, since superagent's cookie jar correctly refuses to replay a Secure cookie over the test server's plain HTTP, a real difference from browser behavior worth knowing about; routes/boards.test.ts: 401/404/403/200 across the full authenticate->loadBoardContext->requireRole chain, confirming the Workspace Owner's implicit-ADMIN access works end-to-end through real middleware, not just the unit-level board-role.service test). One real bug caught in this story's OWN first test, not app code: eslint.config.js's `ignores: ['dist/**']` was combined with `rules` in the same flat-config object, which only narrows that object's scope rather than acting as a global ignore — tseslint.configs.recommended's own rules still applied to apps/api/dist/ (a gitignored build artifact that only exists locally after running `pnpm build`, so this never surfaced in CI, only when this session's own earlier build-verification step left a stale dist/ around); fixed by giving the ignores its own dedicated config object per the documented flat-config pattern. CI: added postgres:16-alpine + redis:7-alpine service containers to .github/workflows/ci.yml's `test` job (POSTGRES_DB set directly to todoapp_test since CI's instance is ephemeral per run, ports matching docker-compose/vitest.config.ts's defaults so no env overrides are needed) — NOT verified against a live GitHub Actions run in this environment (no way to trigger one here), only reasoned from the standard, well-documented service-container pattern; flagging this the same way Story 1.1 flagged CI itself as unverified until a real PR exercises it. Scope explicitly NOT covered, to keep this L story bounded rather than chasing exhaustive coverage: list.service.ts/board.service.ts/workspace.service.ts, the Socket.io gateway/presence/broadcast layer, checklist/comment/attachment/label services, and thin CRUD repositories with no non-trivial logic of their own (adequately exercised transitively through the route/service tests above, same testing-pyramid judgment call a solo dev would make) — the infrastructure built here (fixtures, cleanup pattern, CI wiring) makes adding tests for any of those a small, well-trodden addition whenever there's a specific reason to (e.g. before Story 8.3's E2E suite, or if a regression surfaces)." }
      - { id: "8.3", title: "Playwright E2E suite incl. two-browser-context real-time collaboration test", size: L, status: done, maps_to: "NFR9", notes: "Delivered 2026-07-21. New apps/e2e workspace package (real @playwright/test, not the raw 'playwright' library the throwaway per-story verification scripts used) — playwright.config.ts's webServer array boots both real servers on dedicated ports (3100/4100, so it never collides with a developer's own `pnpm dev`): apps/api via its normal `tsx watch` dev command (fast enough as-is), apps/web via a real production `next build && next start` rather than `next dev`. That build-vs-dev choice was forced by a real, reproducible finding, not a preference: against `next dev --turbopack`, this suite's first navigation to a freshly-touched route stalled past a 30s test timeout mid-'Fast Refresh rebuilding' with a blank page — confirmed via a throwaway debug spec with console/pageerror/dialog listeners attached, deleted after use — Turbopack dev's on-demand per-route compilation, not an app bug. A production build compiles everything upfront, trading a one-time ~40s build for deterministic fast navigations afterward, and is the more realistic E2E target regardless. New apps/e2e/global-setup.ts (self-sufficient, doesn't assume Story 8.2's Vitest suite ran first against the same todoapp_test database): runs `prisma migrate deploy` against it, then flushes the same Redis logical db 1 both suites share — needed because Story 1.4's Redis-backed /auth rate limiter (20 req/15min, keyed by IP) persists across runs, and every request in this suite shares one IP (localhost); without the flush, back-to-back local runs while iterating tripped real 429s (caught directly during development — first run passed 2/4, second consecutive run failed 3/4 with genuine 429 responses in the trace, both from a page that had ALREADY passed once, ruling out a flaky-app explanation). New apps/e2e/fixtures/api.ts sets up fixtures via real REST calls (registerUser/createWorkspace/createBoard/inviteBoardMember/createList/createCard) rather than driving the UI for setup, then loginBrowserAs(context, user) injects the httpOnly refresh cookie directly into the Playwright BrowserContext (parsed from the register response's real Set-Cookie header) so a page navigation's existing silent-refresh-on-load (auth-context.tsx) authenticates it exactly as if that user had logged in through the UI — same 'API for setup, UI for the behavior under test' split every prior story's own manual Playwright verification already used, just made permanent and reusable. Three spec files: auth.spec.ts (register->logout->wrong-password-rejected->correct-login round trip over the real UI, plus duplicate-email rejection); board-basics.spec.ts (real 'Add list'/'+  Add card' inline-entry flows, UX §5); realtime-collaboration.spec.ts — the flagship two-browser-context test the story names explicitly: two independent BrowserContexts as owner + an invited board Member, both connected to the same board, owner moves a Card via the 'Move to list' control (UX §7's mobile fallback, chosen deliberately over simulating a pointer-drag gesture — it drives the exact same moveCard endpoint + card:moved broadcast a drag would through Architecture §6's event catalog, which is the actual thing this test needs to prove; a raw dnd-kit pointer-sensor drag is real but adds simulation flakiness orthogonal to what NFR9 cares about here), and the Member's page asserts the card appears in the target list's DOM with no reload — proving the full Story 5.1 gateway -> 5.3 broadcast -> 5.4 client-merge pipeline live, end-to-end, not simulated. Two real selector bugs found and fixed via this suite's own first runs, not just typecheck: (1) dnd-kit's useSortable sets role='button' on a List's name element (its own drag handle) for keyboard accessibility, silently overriding the underlying <h3>'s implicit heading role — getByRole('heading', ...) never matched; fixed to getByRole('button', ...) once the ARIA snapshot in Playwright's own failure trace made this visible. (2) the Secure refresh cookie (Architecture §7.1) is correctly refused for replay by real browser cookie-jar semantics unless the origin is 'localhost' specifically — confirmed this suite's http://localhost:PORT setup already relies on Chromium's 'localhost is a potentially-trustworthy origin' exception, same property Story 1.9's own manual Playwright verification already leaned on for its hard-reload session-survival check. CI: new `e2e` job in .github/workflows/ci.yml mirroring the `test` job's Postgres/Redis service containers (separate ephemeral instances per job, no shared-state risk despite identical container config) plus a `playwright install --with-deps chromium` step — NOT verified against a live GitHub Actions run in this environment, same documented gap as Story 8.2's CI service containers. Verified end-to-end: 3 consecutive full local suite runs, all 4/4 passing, after the rate-limiter and selector fixes landed." }
      - { id: "8.4", title: "Accessibility audit & fixes: keyboard DnD, focus states, contrast check", size: M, status: done, maps_to: "NFR6", notes: "Delivered 2026-07-21. Contrast: text-amber-600 (due-soon pill on card-item.tsx, plus card-detail.tsx's Dates status text and Story 5.6 conflict-notice text) measured ~3.2:1 against the white card background at this text-xs size -- fails WCAG AA's 4.5:1; swapped to amber-700 (~5:1) in all three spots. Independently re-verified (not just trusted) Story 4.3's label-swatch contrast claims via the same relative-luminance formula -- blue's documented 5.39:1 and black-text swatches (magenta/yellow/aqua, all >=7:1) both checked out exactly, no changes needed there. Screen-reader live region gap: UX §8's own example ('Card moved to Doing by Ayse') was never actually implemented -- Story 5.4's highlight-fade is sighted-only. New apps/web/src/hooks/use-live-move-announcements.ts (mirrors use-out-of-view-toasts.ts's actorName/listName pattern) + a sr-only aria-live=polite region in board-lists.tsx, scoped to card/list moves landing somewhere already visible (out-of-view is already its own role=status live region via Story 5.7's toast, so this deliberately doesn't double-announce that case). Also customized dnd-kit's default Accessibility plugin (on by default, part of dnd-kit's core) via a real <DragOverlay> render-prop in board-lists.tsx -- its default pick-up/drop announcements named the dragged entity by raw UUID (source.id), meaningless read aloud; now says the real card title / list name. Keyboard DnD had literally never been driven end-to-end by any prior story's own Playwright verification (each Epic 3/5 story checked the feature existed, not this specific interaction) -- new permanent apps/e2e/tests/keyboard-dnd.spec.ts (5 tests: same-list reorder, Escape-cancel, cross-list move, list reorder, Enter-opens-card) caught three real, confirmed-pre-existing bugs, none introduced by this story: (1) dnd-kit's default KeyboardSensor treats Enter as a start/end key, racing ahead of card-item.tsx's own onKeyDown (which claims Enter to open Card Detail) since dnd-kit's native listener fires before React's synthetic one -- Enter silently started an invisible drag instead of ever opening the card; fixed with a per-card KeyboardSensor override (sensors: [...]) dropping Enter from start/end, Space-only, List dragging keeps the unmodified default since it has no such conflict. (2) Cards disable dnd-kit's OptimisticSortingPlugin (a prior Story 3.6 removeChild crash, cross-List drags); Escape-canceling a keyboard drag never reverted the React-state-driven optimistic reorder handleDragOver applies mid-drag, leaving the card visually stuck in its rejected position until an unrelated refetch -- fixed in handleDragEnd's canceled branch (revert cardsByList to serverCardsByList for card sources; List sources are unaffected, their own default plugin already snaps back for free). (3) A second, independent source of the exact same removeChild crash class survived even with OptimisticSortingPlugin off: the default Feedback plugin (always active, separate from Sortable's own plugins) inserts a 'hidden placeholder' DOM node directly into the list on every drag, outside React's knowledge -- reproduced via a real keyboard cross-list move, ~40% of runs, confirmed present on the pre-this-story codebase too via git stash (not a regression, just never keyboard-tested before). First attempt, Feedback.configure({feedback:'move'}), did remove the placeholder but introduced a new deterministic regression of its own (confirmed with the user before proceeding further) -- moving the original element via dnd-kit's own transform conflicted with this app's state+FLIP-driven reordering, making one ArrowDown press shift a card two slots instead of one, 3/3 repro. Reverted that in favor of the officially-documented alternative: a real <DragOverlay> (the same one now also carrying the Accessibility-announcement fix above) -- dnd-kit skips placeholder creation for every entity whenever an overlay is present and leaves the original source element completely untouched in the DOM, which fixed both the crash and the overshoot regression with no plugin config needed on card-item.tsx at all. Modal focus trap + Escape (UX §8): verified via a throwaway Playwright script across all three dialogs in the app (Card Detail, Global Search, Notification Center) -- a naive '[role=dialog] contains activeElement' check produced false-positive 'escaped' signals (base-ui renders some legitimate modal-internal nodes outside that specific queried element), but the real, meaningful check -- does focus ever reach actual board content underneath (data-flip-id/data-list-id elements) -- held clean across 30+ Tab presses on every dialog, and Escape correctly closed all three. No fix needed there; base-ui's Dialog primitive already satisfies this. Verified end-to-end: pnpm lint/typecheck/test clean across the whole monorepo (35 API + 4 web Vitest tests); the new keyboard-dnd.spec.ts passed 6/6 real executions across repeated stress runs post-fix with zero removeChild crashes and zero positional-assertion failures (remaining failures in those runs were exclusively the pre-existing Story 8.3-documented /auth rate-limiter artifact of repeated local runs, not app bugs)." }
      - { id: "8.5", title: "Performance pass: verify NFR1 (<200ms/300ms p95) and NFR2 (<1s) against seeded data volume", size: M, status: done, maps_to: "NFR1, NFR2", notes: "Delivered 2026-07-21. Open question resolved with the user before starting: neither PRD §9 nor Architecture ever pin a concrete 'seeded data volume' for this story (open_items_before_first_standup only tracks the solo-developer/demo-date/attachment-size assumptions, not this one) — user chose a reasonable 'portfolio scale' judgment call over asking for exact numbers or descoping the story. New apps/api/src/scripts/seed-perf-data.ts (tsx, real Prisma writes against the local dev DB, not the todoapp_test DB Story 8.2/8.3 own): 3 Workspaces x 5 Boards x 8 Lists x 40 Cards = 4,800 Cards, each Board fully staffed with 4 Board Members, and a realistic (not universal) subset of Cards carrying Labels (1/3)/Assignees (1/4)/a 3-item Checklist (1/5)/Comments (1/7) so the benchmark below actually exercises card.repository.ts's nested withRelations join (labels+assignees+checklists+items), not bare rows — idempotent by construction (re-running first deletes any Workspace named with its own 'Perf Test Workspace' prefix, same cleanupWorkspace-before-cleanupUser cascade order test-support/fixtures.ts already established for Restrict-on-Workspace.ownerId). Ran in ~30s via bulk createMany batches with client-generated UUIDs (not per-row .create() calls) to stay fast at this volume. New apps/api/src/scripts/perf-benchmark.ts measures the two concrete NFR1/NFR2 numbers against a real running dev server (not a mock): logs in as the seeded user over real HTTP, runs 50 iterations each of GET /workspaces, GET /boards/:id, GET /boards/:id/lists, GET /lists/:id/cards (once per List on the first seeded Board — the heaviest read in the app, exactly the withRelations join above), PATCH /cards/:id, and POST /cards/:id/move, computing p50/p95/p99 per endpoint; separately opens two authenticated socket.io-client connections both joined to the same board room and times 20 trials of a REST card move against the OTHER socket's card:moved receipt, for NFR2. Added socket.io-client as an apps/api devDependency (previously only apps/web's own runtime dependency) since this is the first thing in the API package that needed a socket client rather than the server side. Wired pnpm --filter @todoapp/api run seed:perf / perf:bench. RESULTS (this machine, local Postgres+Redis via docker-compose, dev server via tsx watch, not a production build): NFR1 — worst-endpoint p95 was PATCH /cards/:id at 180.1ms (p50 78.9ms; one outlier max of 398.3ms across 50 runs, everything else's p95 was 155ms or under, e.g. GET /lists/:id/cards's heavier nested-relations read was 88.1ms p95 across 150 samples) — comfortably under the <300ms target, PASS. NFR2 — card:moved broadcast reached the second, already-connected socket at p95 134.4ms (p50 98.8ms, max 167.9ms across 20 trials) — comfortably under the <1s target, PASS. Client-side '<200ms perceived latency' (NFR1's other half — open board / drag a card) is deliberately NOT independently re-measured with a browser tool here: Architecture §4 already designs every List/Card write as an O(1) single-row transaction specifically to satisfy it, the actual per-request cost IS the API numbers just measured, and Story 8.3's Playwright suite already exercises the real UI paths this data renders through — re-measuring with Lighthouse/a browser trace on top would be duplicate infrastructure for a number this story's own API benchmark already bounds. Verified end-to-end: both scripts run clean against the real dev server and real seeded volume (not test doubles), pnpm lint/typecheck clean on both new scripts, and the seeded perf-test Workspaces/Users were deleted afterward (same 'clean up test data from the local DB after verification' convention Story 7.1/7.2 already established) — the scripts themselves stay in the repo, reusable for a future re-run, per PRD §8's success metric wanting a load test 'included in the repo' rather than a one-off throwaway. Found, but deliberately did NOT kill, two long-orphaned zombie 'tsx watch src/index.ts' processes (not from this session, several days old, holding no port) while investigating why localhost:4000 wasn't responding at session start — killed only the one dev-server process this session itself started for the benchmark run, and left those two pre-existing orphans alone since their origin predates this session; same known zombie-dev-process class Story 1.7 first documented, flagged to the user rather than force-killed." }
