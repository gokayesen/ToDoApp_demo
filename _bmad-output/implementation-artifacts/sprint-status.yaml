    stories:
      - { id: "3.6", title: "Drag-and-drop Card reordering within/across Lists (pointer + keyboard), optimistic update+rollback, server-computed position, mobile Move-to-list fallback", size: L, status: done, maps_to: "FR19, UX §5/§7, NFR6", notes: "Delivered 2026-07-19 (commit 1d8912b). Note added 2026-07-20 during retroactive sprint-status reconciliation — see the commit for original implementation detail." }
      - { id: "3.7", title: "Archive/restore List (cascades to its Cards)", size: S, status: done, maps_to: "FR16", notes: "Delivered 2026-07-20. Backend: POST /lists/:listId/archive and /restore, requireRole('MEMBER') per FR16's literal wording (not ADMIN like Board's own archive/restore, Story 2.7). Added Card.archivedWithList (migration 20260719230235_card_archived_with_list) to distinguish Cards archived by this List-archive cascade from ones a user independently archives later (Story 3.8, not yet built) -- restoring a List only un-archives Cards it cascade-archived, confirmed by manually archiving one Card directly in the DB before archiving the List and checking it stayed archived through an archive+restore cycle. Both endpoints idempotent, same rationale as Board archive/restore. Frontend: added the List header \"...\" menu UX §4.2 calls for (didn't exist yet -- Story 3.1 shipped rename/delete on the backend only, no menu), with an \"Archive list\" item behind a confirmation dialog (per user decision: cascade impact on Cards warranted a confirm step rather than the optimistic+toast-undo pattern used elsewhere) that states the affected card count. Restore has no UI surface yet -- there's no \"view archived lists\" panel anywhere in the app yet (same gap exists for Board archive/restore from Story 2.7), left for a future story since none is currently scheduled for it. End-to-end verified: backend via curl (cascade archive/restore semantics, idempotency, VIEWER/non-member 403, nonexistent-list 404) and frontend via a throwaway Playwright script (list+2 cards created, archive dialog shows correct card count, Cancel leaves the list intact, confirming removes it from the board) -- both scripts deleted after the run." }
      - { id: "3.8", title: "Archive/restore Card; permanent delete Card", size: S, status: done, maps_to: "FR21, FR22", notes: "Delivered 2026-07-20. FR22 (permanent delete) was already fully built in Story 3.1 (DELETE /cards/:cardId, hard delete) -- confirmed still working end-to-end, nothing to add there. FR21 added POST /cards/:cardId/archive and /restore, requireRole('MEMBER'), idempotent like every other archive/restore endpoint in the app. Restoring a Card also clears the Story 3.7 archivedWithList flag (card.repository.ts setCardArchived) so a Card explicitly restored on its own doesn't stay tagged as tracking a List-archive cascade it's no longer part of. Scope decision: no frontend UI wired up, matching Board archive/restore's precedent (Story 2.7, still UI-less) -- UX-Design.md only specifies an archive/delete affordance for Cards inside the Card Detail modal (§4.3), which doesn't exist until Story 4.1; the board face's per-Card UI (§4.2/FR23) is read-only preview badges (Story 3.9), not actions. Building a one-off card-face menu now would preempt Card Detail's real home for this control. End-to-end verified via curl: archive hides the Card from GET /lists/:listId/cards, restore brings it back, idempotent on repeated archive calls, VIEWER role correctly 403s, nonexistent card 404s, and the pre-existing hard-delete endpoint still removes a Card for good." }
      - { id: "3.9", title: "Card face preview: labels, due-date pill, assignee avatars, checklist progress, comment/attachment counts (stubs until Epic 4)", size: S, status: done, maps_to: "FR23", notes: "Delivered 2026-07-20. Scope check with the user before building: labels/assignees/checklists/comments/attachments have no data model at all yet (Epic 4 stories 4.3/4.5/4.6/4.7/4.8), so there's nothing real to preview for them -- user chose building only the due-date pill now (the one piece of FR23 backed by real data, Card.dueDate from Story 3.1's schema) over pre-building empty placeholder slots for the rest, since Epic 4 will likely need to rewrite that scaffolding anyway once real data lands. CardItem now shows a compact clock-icon pill with the formatted due date when card.dueDate is set, nothing when it's null; no overdue color/icon flag (that's explicitly Story 4.4's FR25 scope, not this one). Also fixed a pre-existing type drift caught while touching this file: packages/shared's cardSchema was missing archivedWithList (added in Story 3.7's migration) -- it was never actually parsed anywhere at runtime (cardSchema only backs the exported TS Card type, no .parse() call exists in the codebase), so this was latent, not a live bug. No UI yet exists to set a Card's due date (Card Detail modal is Story 4.1), so verified by writing dueDate directly via Prisma in a throwaway script and confirming the pill rendered post-reload while a sibling card with no due date correctly showed nothing." }
      - { id: "3.10", title: "(stretch) Cross-board card move", size: M, status: backlog, maps_to: "FR20 — out-of-scope candidate, PRD §8", notes: "Stretch/optional per PRD §8 descope list — schedule last or drop if timeline is tight" }

  - sprint: 7
    epic: "Epic 5 — Real-Time Collaboration (part 1, pulled forward)"
    theme: "Socket gateway, presence, broadcast pipeline — de-risk WS infra early per Architecture §10"
    depends_on_sprints: [6]
    notes: "Pulled forward per Epics-and-Stories.md Cross-Epic Sequencing Note: starts right after Epic 3, not after Epic 4."
    stories:
      - { id: "5.1", title: "Socket.io gateway: handshake auth via access token, connection middleware, board:join/leave with role re-validation, Redis adapter, client reconnect-on-refresh", size: L, status: done, maps_to: "Architecture §6", notes: "Delivered 2026-07-20. Backend: apps/api/src/sockets/gateway.ts -- io.use() handshake middleware verifies the JWT access token with the same verifyAccessToken() the REST authenticate middleware uses, rejecting before board:join is possible; board:join/board:leave handlers join/leave room board:{boardId}, re-validating the caller's effective role server-side per request rather than trusting the client-supplied id. Extracted the Owner-implicit-ADMIN-else-BoardMember-row role resolution out of middleware/load-resource-context.ts into services/board-role.service.ts so both REST and the socket gateway share one implementation instead of two copies drifting apart. Redis adapter wired via @socket.io/redis-adapter with two duplicated ioredis connections (pub/sub needs dedicated connections, can't share lib/redis.ts's client since a subscriber connection can't issue other commands). index.ts now builds an explicit http.Server via http.createServer(app) so Socket.io can share the same port as the REST API. apps/api's tsx watch dev process restarted clean with the change, confirmed via /health. Frontend: lib/socket-client.ts (one shared socket per browser session, auth as a callback function so every reconnect attempt reads the current in-memory token, connect_error triggers a silent REST refreshSession()+retry per Architecture §6's 'reconnection on token expiry') and hooks/use-board-room.ts (join on mount/connect, leave on unmount), wired into the Board View page -- nothing user-visible yet since there's no presence UI (Story 5.2) or broadcast consumption (Story 5.3) to show, this only establishes the room membership those stories build on. Explicitly did NOT touch Railway/production deployment in this story -- that's out of scope until Story 8.7; this is local-dev-server infra only, same Postgres+Redis docker-compose services already in use. End-to-end verified via a raw socket.io-client script: missing/garbage token both rejected at handshake, valid token accepted, Owner's implicit ADMIN can join their own board, nonexistent board rejected, a user with zero board access rejected, and that same user succeeds after being invited as VIEWER (role re-validation is live, not cached) -- 9/9 checks. Also verified via Playwright that the real Board View page establishes a socket.io connection with no unexpected console errors." }
      - { id: "5.2", title: "Presence: Redis presence set per board room, presence:update broadcast, live avatar stack", size: M, status: done, maps_to: "FR32, UX §6", notes: "Delivered 2026-07-20 (commit f9072e0). Note added 2026-07-20 during retroactive sprint-status reconciliation — see the commit for original implementation detail." }
      - { id: "5.3", title: "Broadcast pipeline: every List/Card mutation emits its event to the board room after DB commit", size: L, status: done, maps_to: "FR31, Architecture §6 event catalog", notes: "Delivered 2026-07-20 (commit 8000c10). Note added 2026-07-20 during retroactive sprint-status reconciliation — see the commit for original implementation detail." }

  - sprint: 8
    epic: "Epic 4 — Card Detail & Rich Content (part 1)"
    theme: "Card Detail shell, title/description, labels, dates, assignees"
    depends_on_sprints: [6]
    stories:
      - { id: "4.1", title: "Card Detail modal/drawer shell (responsive: modal desktop, sheet mobile)", size: M, status: done, maps_to: "UX §4.3", notes: "Delivered 2026-07-20 (commit d104c14). New apps/web/src/components/board/card-detail.tsx: a single base-ui Dialog.Popup with responsive Tailwind classes (fixed inset-0 full-screen by default, sm: breakpoint switches to a centered max-w-2xl rounded modal) rather than two separate components — same single-DialogContent approach as ui/dialog.tsx. Shows title + Board/List breadcrumb + close button only; metadata row, description, checklists, attachments, and the activity/comment feed are explicitly out of scope here (later Epic 4 stories). Opens on CardItem click or Enter keypress (Space stays reserved for dnd-kit's drag pick-up); the 'Move to list' dropdown's click is now stopPropagation'd so it no longer also opens the card underneath it. Card data is read straight from board-lists.tsx's existing cardsByList state (already the live, broadcast-synced source of truth per Story 5.4) — no new GET /cards/:cardId endpoint needed for the shell. Verified with a throwaway Playwright script (chromium, deleted after the run): registered a user, created workspace/board/list/card via the real API, then drove the real UI — desktop modal shows correct title+breadcrumb, closes via both the close button and Escape, and at a 390x844 mobile viewport the popup's bounding box is exactly 0,0,390,844 confirming a true full-screen sheet, not just a resized modal." }
      - { id: "4.2", title: "Inline-editable title & markdown description", size: S, status: done, maps_to: "FR18", notes: "Delivered 2026-07-20 (commit 9e01833). Backend: PATCH /cards/:cardId, title/description both independently optional in updateCardRequestSchema so a save of one field doesn't clobber the other; requireRole('MEMBER') same as every other Card mutation. Frontend: title is click/Enter-to-edit (input, saves on blur or Enter, Escape reverts); description renders via react-markdown + a newly-added @tailwindcss/typography plugin (`prose` classes) when not focused, plain textarea while editing. On save, patches the ['cards', listId] TanStack Query cache directly with the PATCH response instead of invalidating, to avoid a flash back to the pre-edit value during the refetch round-trip. Two real bugs caught and fixed during Playwright verification, not just typecheck/lint: (1) base-ui's Dialog closes the whole modal on Escape by default — the field-level Escape handler needed event.stopPropagation() or it bubbled up and closed Card Detail entirely instead of just cancelling the field edit; (2) React unmounting a still-focused input/textarea (on cancel) makes the browser fire a native blur, which was re-triggering the save handler with the just-cancelled draft — fixed with a cancelledRef flag reset at the start of each new edit session (an earlier version of the fix forgot to reset it on re-entering edit mode, which then silently swallowed the NEXT legitimate save — caught by scripting two edit cycles in one verification run, not just one). Verified with a throwaway Playwright script (deleted after the run): rename persists after reload, Escape truly cancels without saving, markdown (heading/bold/list) renders correctly after a real save+reload round trip." }
      - { id: "4.3", title: "Labels: per-board CRUD (name+color) + attach/remove on card, accessible color palette", size: M, status: done, maps_to: "FR24", notes: "Delivered 2026-07-20 (commit 397e66d). New Label + CardLabel (join) Prisma models, both cascading from their parent. Label taxonomy is board-scoped, ADMIN-gated (same rationale as Board background customization, Story 2.9); attach/detach on a Card is MEMBER-gated like every other Card mutation. Every Card-returning query in card.repository.ts now includes+flattens Labels so Card.labels is always populated consistently regardless of endpoint. Frontend: a LabelPicker popover built on the existing DropdownMenu primitive (CheckboxItem-style toggle rows) handles create/rename/delete/attach/detach in one place; Card Detail shows attached labels as named chips, the board face (card-item.tsx) shows color-only dots per UX §4.2. 8-swatch palette is the dataviz skill's validated categorical palette, with blue stepped one shade darker (#256abf vs #2a78d6) since label chips render text directly on the fill and the reference shade falls just short of 4.5:1 AA against white. TWO real bugs found via Playwright, not just typecheck/lint: (1) typing in the picker's create-label Input was being intercepted by DropdownMenu's own roving-focus/typeahead keydown handling — fixed with a stopPropagation wrapper. (2) A genuine Next.js 15.5.20/Turbopack barrel-file bug (not a logic bug): importing ANY value export (const array or Record object; type-only imports are unaffected) from packages/shared's schemas/label.ts into a 'use client' component broke the bundler's resolution of unrelated sibling exports from the whole shared-package barrel (packages/shared/src/index.ts) — reproduced by bisecting with git stash + incremental file stubs across ~10 dev-server restarts. Worked around by moving the presentation-only LABEL_COLORS/LABEL_COLOR_HEX/LABEL_COLOR_TEXT constants into apps/web/src/lib/label-colors.ts; packages/shared keeps only the LabelColor type + validation enum. Flagging this pattern for future Epic 4 stories (4.5 Assignees, 4.6 Checklists, etc.) in case any of them also need a shared-package const value consumed by a client component — see [[project-nextjs-shared-barrel-bug]]. Verified end-to-end with a throwaway Playwright script (deleted after the run): create/rename/delete a Label, attach/detach on a Card, persistence after reload, empty-state message, and a picker-dropdown screenshot confirming correct swatch/contrast rendering." }
      - { id: "4.4", title: "Due/start dates + overdue visual flag (color+icon, not color-only)", size: S, status: done, maps_to: "FR25", notes: "Delivered 2026-07-20. Backend: updateCardRequestSchema (packages/shared) gained nullable/optional startDate+dueDate with a refine() rejecting startDate-after-dueDate (400); card.repository.ts updateCardFields widened to accept them (already flowed through card.service.ts's existing pass-through updateCard, no service/controller/route change needed since PATCH /cards/:cardId was already wired to this schema from Story 4.2). Frontend: new apps/web/src/lib/due-date-status.ts centralizes the tri-state overdue/due-soon(<=24h)/on-track classification shared by card-item.tsx's face pill and card-detail.tsx's status text, so the 'due soon' window is defined once. Card face pill now color+icon codes by status (red+AlertTriangle / amber+Clock / muted+Calendar) rather than the old flat clock-icon-only pill, each with an sr-only text label per UX §8 'color is never the only signal'. Card Detail gained a Dates row (native date inputs for Start/Due, immediate-save on change, same UX §4.3 metadata-row position between Labels and Description) plus an inline Overdue/Due soon/On track status label. Verified end-to-end with a throwaway Playwright+fetch script (deleted after the run): dueDate persistence, startDate-after-dueDate 400 rejection, null-clears-a-date, overdue/due-soon pill color classes on the board face, due-date input pre-fill from a server-set value, a UI-driven startDate edit round-tripping to the backend, and the on-track status text rendering in Card Detail — 8/8 checks." }
      - { id: "4.5", title: "Assignees: add/remove Board Members on a card", size: S, status: done, maps_to: "FR26", notes: "Delivered 2026-07-20. New CardAssignee join model (migration 20260720131849_card_assignees), plain many-to-many cascading from both sides per Architecture §4's cascade table (same 'pure membership row' rationale as BoardMember/WorkspaceMember). POST/DELETE /cards/:cardId/assignees, requireRole('MEMBER') like every other Card mutation; assignment validated against an explicit BoardMember row via card.service.ts assignUser -- rejects with 400 if the target userId has no BoardMember row on this board. Scope decision: a Workspace Owner's implicit Board access (Architecture §7.4, no BoardMember row) is therefore NOT assignable through this endpoint/picker -- same explicit-membership scope Story 2.5/2.6's invite/role-change already operate on; documented on packages/shared's new boardMemberSchema and the listBoardMembers repository function rather than silently left ambiguous. Had to add GET /boards/:boardId/members (didn't exist at all -- Epic 2's invite/role-change stories built the mutation endpoints but no listing endpoint or UI ever consumed board membership), VIEWER-gated same as GET /boards/:boardId itself. card.repository.ts's include/mapCard (previously 'withLabels', Story 4.3) generalized to 'withRelations' covering both Labels and Assignees in one place. Frontend: new AssigneePicker (apps/web/src/components/board/assignee-picker.tsx) mirrors LabelPicker's toggle-row popover pattern minus the create/edit form (Board Member management stays Board settings' job, out of scope here); extracted PersonAvatar + a generic AvatarStack (apps/web/src/components/ui/person-avatar.tsx) out of presence-avatars.tsx -- real reuse once Card assignees needed the identical 'avatar or initials, +N overflow' rendering UX §4.2 specifies (max 3 shown on the card face) as presence already had. Verified end-to-end with a throwaway Playwright+fetch script (deleted after the run): invite-adds-existing-user, GET /boards/:id/members lists them, assign/unassign round-trip on a Card, assigning a non-member 400s, unassign idempotency, and the assignee avatar rendering both inside Card Detail and on the board-face card after using the real picker UI -- 8/8 checks." }

  - sprint: 9
    epic: "Epic 4 — Card Detail & Rich Content (part 2)"
    theme: "Checklists, comments, attachments, activity log"
    depends_on_sprints: [8]
    stories:
      - { id: "4.6", title: "Checklists: create, add/check/reorder items, progress bar", size: M, status: done, maps_to: "FR27", notes: "Delivered 2026-07-20. New Checklist + ChecklistItem models (migration 20260720133404_checklists), Card -> Checklist -> ChecklistItem, cascading per Architecture §4; position uses the same shared fractional-index engine as List/Card (services/position.service.ts) -- Checklists themselves only append (no reorder-checklist endpoint, story scope is 'reorder items' not checklists). Route surface: nested POST /cards/:cardId/checklists for creation (same nested-under-parent convention as List/Card), plus new top-level /checklists and /checklist-items routers (delete checklist, create/update/delete/move item) -- needed two new loadResourceContext walkers (Checklist->Card->List->Board, ChecklistItem->Checklist->Card->List->Board) alongside the existing Board/List/Card/Label ones. Every mutation reloads+broadcasts the whole parent Card via the existing card:updated event rather than the Architecture §6 catalog's separate 'checklist:updated' name -- same choice Story 4.3/4.5 made (the client's live-update hook already merges full card:updated payloads, including nested checklists, for free). Real bug caught during Playwright verification, not just typecheck: the checkbox was purely server-round-trip-controlled with no optimistic update, so Playwright's own click-then-verify assertion failed -- UX §5 explicitly names 'check a checklist item' as an optimistic-update example, so toggling now writes straight into the ['cards', listId] TanStack cache (with a snapshot rollback on error) so the checkbox AND its progress bar move together instantly instead of after the PATCH resolves. Item reordering is keyboard-operable up/down buttons, not drag-and-drop -- UX §5's DnD pattern is explicitly scoped to Lists/Cards (FR15/FR19) only, so a third independent dnd-kit sortable context here would be scope beyond FR27. Card face gained a '3/5' checklist-progress pill per UX §4.2 (turns accent-colored on 100% completion). Verified end-to-end with a throwaway Playwright+fetch script (deleted after the run): checklist/item CRUD, check-toggle, rename, reorder (including a self-referential-move 400 rejection), delete, checklist delete, and the real UI flow (add checklist, add 2 items, check one, progress text and board-face pill both showing 1/2) -- 11/11 checks." }
      - { id: "4.7", title: "Comments with @mention autocomplete (scoped to Board Members)", size: M, status: done, maps_to: "FR28", notes: "Delivered 2026-07-20. New Comment model (migration 20260720135336_comments): userId nullable + SetNull on user deletion, authorNameSnapshot denormalized at creation, per Architecture §4's cascade table (same rationale as the not-yet-built Attachment.uploaderId/ActivityLog.userId). POST /cards/:cardId/comments nested (same convention as Checklist creation, Story 4.6); DELETE /comments/:commentId is a new top-level router with an extra author-or-admin check in comment.service.ts -- the one Card-content mutation in the app that ISN'T uniformly MEMBER-gated regardless of who created the thing, since a comment is a personal statement (every other mutation -- labels, assignees, dates, checklists -- any Member can touch any Card's content). Scope decision: @mentions are a plain-text '@Full Name' convention, no structured mention table (the Architecture §4 ER diagram's Comment entity has no mention field either) -- the composer's autocomplete (reuses Story 4.5's GET /boards/:boardId/members + AssigneePicker's board-members query cache) inserts literal text on selection, the feed re-highlights matches against the board's CURRENT member names (longest-name-first regex to avoid a short name shadowing inside a longer one). No Notification wiring -- Notification/NotificationPreference don't exist until Epic 6 Story 6.1, and firing a mention notification is explicitly Story 6.3's job, not this one. Client-side delete-button visibility only checks 'is this my own comment' (no board-role awareness exists anywhere on the client yet) -- the backend's admin-override still works for anyone calling the API directly, just has no UI affordance yet; flagging this gap in case a future story wants a real moderation UI. Card face gained a comment-count icon per UX §4.2, in the same 'small icon row' as the Story 4.6 checklist-progress pill. Verified end-to-end with a throwaway Playwright+fetch script (deleted after the run): comment create/delete, author-vs-non-author-vs-admin delete authorization (3 cases), and the real UI flow -- typing '@Mem' surfaces the autocomplete, selecting it inserts '@Member Tester ', the posted comment renders the mention highlighted, and the board-face pill shows the correct comment count -- 8/8 checks." }
      - { id: "4.8", title: "Attachments: presigned R2 upload, image thumbnail vs. file-link rendering, size-limit enforcement", size: M, status: done, maps_to: "FR29", notes: "Delivered 2026-07-20. New Attachment model (migration 20260720141553_attachments): uploaderId nullable + SetNull, uploaderNameSnapshot denormalized, same pattern as Story 4.7's Comment.userId. createdAt added even though the Architecture §4 ER diagram's Attachment block omits it (unlike Comment/ActivityLog, which both have one) -- chronological ordering needs it, same kind of gap-fill as Story 3.9's archivedWithList. Direct-to-R2 two-step flow per Architecture §3/§9 (API never proxies file bytes): POST /cards/:cardId/attachments/presign (new apps/api/src/lib/r2.ts, @aws-sdk/client-s3 + s3-request-presigner) issues a short-lived PUT URL, client uploads straight to R2, then POST /cards/:cardId/attachments records the result; when R2 is configured, fileUrl must live under our own R2_PUBLIC_URL base before being recorded (prevents an authenticated Member registering an arbitrary external URL as a Card attachment). Size limit proceeded with the documented-but-UNCONFIRMED 10MB default (PRD §9 assumption #3, still open per open_items_before_first_standup) per user's explicit go-ahead this session -- validated at both the presign and confirm steps. Deletion (DELETE /attachments/:attachmentId) uses the same uploader-or-admin authorization as Story 4.7's comment deletion, not the uniform any-Member gate every other Card-content mutation uses. r2.ts follows the exact guarded-configuration pattern as lib/email.ts (Resend, Story 1.7) and passport.ts (Google OAuth, Story 1.5): no R2 credentials configured -> presign 503s cleanly rather than the process assuming storage exists. NOT tested against a real R2 bucket in this environment (no live credentials, same gap as Story 1.5's untested live Google OAuth handshake) -- verified instead via the confirm-record endpoint directly (bypassing presign, since the fileUrl-prefix check only applies when R2 IS configured) for uploader snapshot, size-limit rejection, and the three-case uploader/non-uploader/admin delete-authorization matrix, plus confirming the clean 503 surfaces all the way to a UI error message when a real upload is attempted. Card face gained an attachment-count icon (UX §4.2's last icon-row slot, after checklist progress and comment count); Card Detail's Attachments section (between Checklists and Comments, matching UX §4.3's literal ordering) renders an image thumbnail grid vs. file-icon rows per FR29. 10/10 Playwright+fetch checks passed." }
      - { id: "4.9", title: "Card Activity Log: system-generated entries interleaved with comments", size: M, status: done, maps_to: "FR30", notes: "Delivered 2026-07-20, completing Epic 4 (4.1-4.9 all done). New ActivityLog model (migration 20260720143319_activity_log) matching Architecture §4's ER diagram exactly: boardId required, cardId nullable -- this story only ever writes card-scoped entries (scope decision: board/workspace-level activity, e.g. membership changes, has no writer yet since no story asks for a board-level activity UI). cardId uses SetNull (not Cascade) on Card deletion, extending the same 'preserves the audit trail' rationale Architecture §4 states for the userId SetNull relations -- deleting a Card shouldn't erase the board's history of what happened to it. Single logActivity() helper (services/activity-log.service.ts) called from every existing Card-content mutation's mutate->reload->broadcast round-trip (card/checklist/attachment services) -- had to thread actorId through several service signatures that didn't carry it before (updateCard, archiveCard/restoreCard, attachLabel/detachLabel, assignUser/unassignUser, createChecklist/deleteChecklist), since none of those needed 'who did this' before now. Logged events: title rename, description edit, due/start date change (set and clear both logged distinctly), cross-list move only (a same-list reorder is NOT logged -- not a status change, matches UX §4.3's own example which is specifically a cross-list move), label attach/detach, assignee add/remove, checklist create/delete, attachment add/remove, archive/restore (only on an actual state flip, not idempotent re-affirmation). Comments are deliberately NOT double-logged as activity -- the feed already renders them directly. Frontend: comment-section.tsx merges card.comments + card.activityLog into one chronologically-sorted feed per UX §4.3's literal wording; new apps/web/src/lib/describe-activity.ts maps {type, metadata} to the human-readable line ('Ayşe moved this card from To Do to Doing', matching the UX spec's own example almost verbatim). Card Detail's section header renamed Comments -> Activity to match the merged content. Verified end-to-end with a throwaway Playwright+fetch script (deleted after the run): all 12 event types logged with correct metadata across the full mutation surface, within-list-reorder correctly NOT logged, idempotent archive correctly NOT double-logged, comments correctly NOT logged, chronological ordering, and the real UI rendering both the human-readable activity line and an interleaved comment in the same feed -- 22/22 checks." }

